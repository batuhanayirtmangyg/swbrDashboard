// ── Formatting ────────────────────────────────────────────────────────────
var FMT = {
  // toPrecision(12) first, then toFixed: a mean built by accumulating floats lands just BELOW
  // the true value (mean(1.0,2.8,0.6,1.0) is 1.3499999999999998, not 1.35), and toFixed then
  // rounds it down — the P90 QTD read 1.3d against Looker's 1.4d. Trimming to 12 significant
  // digits restores the exact decimal before rounding, so an exact .x5 goes up like Looker.
  // ponytail: still tie-breaks down where .x5 has no exact double (13.45 -> 13.4); irrelevant
  // at this metric's 0-5 day range, revisit if a 'days' metric ever reads in the tens.
  days:  function (v) { return Number(v.toPrecision(12)).toFixed(1) + 'd'; },
  count: function (v) { return Math.round(v).toLocaleString(); },
  pct:   function (v) { return v.toFixed(1) + '%'; },
  eur:   function (v) { return '€' + v.toFixed(1); },
  eurM:  function (v) { return '€' + (v / 1e6).toFixed(1) + 'M'; }
};
function fmtVal(v, fmt) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return (FMT[fmt] || FMT.count)(Number(v));
}
// Each FMT bakes its unit into the formatted string, so there was no way to ask "what unit is

var UNIT = { days:'days', count:'count', pct:'%', eur:'€', eurM:'€M' };
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = Number(v); return isNaN(n) ? null : n;
}

// ── meta sheet → registry overrides (fuzzy, tolerant of unknown headers) ──────
function applyMeta(meta) {
  if (!meta || !meta.headers) return;
  var H = meta.headers.map(function (h) { return String(h).toLowerCase(); });
  function findCol() {
    for (var a = 0; a < arguments.length; a++) {
      var toks = arguments[a];
      for (var i = 0; i < H.length; i++) if (toks.some(function (t) { return H[i].indexOf(t) >= 0; })) return i;
    }
    return -1;
  }
  var cKey = findCol(['metric','key','sheet','name']);
  var cLag = findCol(['lag']);
  var cDir = findCol(['lower','direction','higher','better']);
  var cLab = findCol(['label','display','title']);
  var cStg = findCol(['stage','group','lifecycle']);
  if (cKey < 0) { console.warn('meta: no key column found; ignoring'); return; }
  meta.rows.forEach(function (r) {
    var idraw = String(r[cKey]).trim();
    var id = idraw.toLowerCase();
    var cfg = REG_BY_KEY[idraw] || METRIC_REGISTRY.filter(function (m) {
      return m.key.toLowerCase() === id || (m.sheet && m.sheet.toLowerCase() === id) || m.label.toLowerCase() === id;
    })[0];
    if (!cfg) { console.warn('meta: no registry match for "' + idraw + '"'); return; }
    if (cLag >= 0) { var lg = num(r[cLag]); if (lg !== null) cfg.lagWeeks = lg; }
    if (cDir >= 0) {
      var d = String(r[cDir]).toLowerCase();
      if (d.indexOf('lower') >= 0 || d === 'true' || d === '1' || d.indexOf('down') >= 0) cfg.lowerIsBetter = true;
      else if (d.indexOf('higher') >= 0 || d === 'false' || d === '0' || d.indexOf('up') >= 0) cfg.lowerIsBetter = false;
    }
    if (cLab >= 0 && r[cLab]) cfg.label = String(r[cLab]);
    if (cStg >= 0 && r[cStg] && STAGES.indexOf(String(r[cStg])) >= 0) cfg.stage = String(r[cStg]);
  });
}

// ── Date / bucket helpers ─────────────────────────────────────────────────────
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseD(s) { return new Date(s + 'T00:00:00Z'); }
function isoOf(d) { return d.toISOString().slice(0, 10); }
function addDays(s, n) { var d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); }

// canonical bucket start Date (UTC) for the week a row belongs to
function bucketStart(weekStart, gran) {
  var d = parseD(weekStart), y = d.getUTCFullYear(), m = d.getUTCMonth();
  if (gran === 'week')    return d;
  if (gran === 'month')   return new Date(Date.UTC(y, m, 1));
  if (gran === 'quarter') return new Date(Date.UTC(y, Math.floor(m / 3) * 3, 1));
  return new Date(Date.UTC(y, 0, 1)); // year
}
function bKey(date, gran) {
  var y = date.getUTCFullYear(), m = date.getUTCMonth();
  if (gran === 'week')    return isoOf(date);
  if (gran === 'month')   return y + '-' + String(m + 1).padStart(2, '0');
  if (gran === 'quarter') return y + '-Q' + (Math.floor(m / 3) + 1);
  return String(y);

var SERVER_MODE = !(BOOT && BOOT.metrics);           // no inlined rows ⇒ fetch from server

// ── Local (in-browser) aggregation — mirrors the server _aggregate exactly.

    });

// One global fetch queue, not one per prefetch() call. Two reasons: the Apps Script per-user cap on

// would re-request every metric that had not landed yet.

var GMV_CATS  = ['Guided Tours', 'Entrance Tickets', 'Shows & Events', 'Other'];
var GMV_CORRS = ['Europe', 'NA', 'APAC incl ANZ', 'RoW'];

function loadGmvBreakdownTables() {

               .concat(GMV_CORRS.map(function (v) { return { col: 'destination_corridor', val: v }; }));

    if (corrEl) corrEl.innerHTML = gmvDimTable('destination_corridor', GMV_CORRS, 'GMV by Destination Corridor');

// Metrics whose series the current view needs (overview needs all, because the

  // Compare fetches only the metric being compared. Returning [] here would make prefetch
  // resolve instantly with nothing and the tab would never paint.
  if (currentView === 'compare') {
    var c = REG_BY_KEY[cmpState().metric];
    return c ? [c] : [];
  }
  return METRIC_REGISTRY.filter(function (m) { return m.stage === currentView; });
}

function bucketize(s, gran) {

  Object.keys(s.weekly).forEach(function (wk) {
    var val = s.weekly[wk]; if (val === null || val === undefined) return;
    var bs = bucketStart(wk, gran); if (isNaN(bs.getTime())) return;   // skip unparseable week key (never crash the view)
    var key = bKey(bs, gran);
    _accWeek(s, acc, key, wk, val);

  Object.keys(acc).forEach(function (k) { out[k] = _rollBucket(s, acc[k]); });

    var v = s.weekly[w]; return v !== null && v !== undefined && (s.kind !== 'wrate' || v.den);

}

function laggedWeek(cfg, minLag) {
  var d = bucketStart(selectedWeek, 'week');

  return isoOf(new Date(d.getTime() - lag * 7 * 86400000));

function _liveInsight() {
  // Option B: worst L12W YoY from already-fetched SERIES_CACHE (tab switches)
  if (REG_BY_KEY && Object.keys(SERIES_CACHE).length) {
    var worst = null, worstDelta = Infinity;
    Object.keys(SERIES_CACHE).forEach(function (k) {
      var parts = k.split('|'); if (parts[1] !== 'ALL') return; // unfiltered only
      var cfg = REG_BY_KEY[parts[0]]; if (!cfg || cfg.hidden) return;
      var res = SERIES_CACHE[k];
      var primary = res && res.series && res.series.filter(function (s) { return !s.isDim && !s.member; })[0];
      if (!primary || !primary.weekly || !Object.keys(primary.weekly).length) return;
      // minLag 1: the newest week is still running. Comparing its fragment against a full
      // prior-year week biased this scan toward whichever metric had the emptiest week.
      var anc = laggedAnchor(primary, cfg, 1); if (!anc) return;
      var curr = l12wAbs(primary, anc);
      var py   = l12wAbs(primary, new Date(anc.getTime() - 364 * 86400000));
      if (curr == null || py == null || py === 0) return;
      var delta = (curr - py) / Math.abs(py);
      if (cfg.lowerIsBetter) delta = -delta; // flip: positive delta = good
      if (delta < worstDelta) { worstDelta = delta; worst = { label: cfg.label, delta: delta }; }
    });
    if (worst && worstDelta < -0.03) { // only surface if meaningfully off
      var pct = Math.round(Math.abs(worst.delta) * 100);
      return worst.label + ' is down ' + pct + '% L12W YoY — worth the first look.';
    }
  }
  // Option A: week / quarter context from BOOT
  if (BOOT && BOOT.weeks && BOOT.weeks[0]) {
    var cw = isoWeek(new Date(BOOT.weeks[0])).week;
    var qWeek = ((cw - 1) % 13) + 1; // 1–13 within the quarter
    if (qWeek >= 12) return 'Last ' + (14 - qWeek) + ' week(s) of the quarter — QTD vs Target is your only number now.';
    if (qWeek <= 2)  return 'CW ' + cw + ' — early quarter. Set your QTD baseline before the noise kicks in.';
    return 'CW ' + cw + ', week ' + qWeek + ' of the quarter — ' + (13 - qWeek) + ' weeks left to close any gap.';
  }
  // fallback: random static
  return _LOAD_INSIGHTS[Math.floor(Math.random() * _LOAD_INSIGHTS.length)];
}

function makeMultiSelect(f, members) {
  var sel = currentFilters[f.key] || [];
  var wrap = document.createElement('div'); wrap.className = 'ctrl-group ms-group';
  var lab = document.createElement('label'); lab.textContent = f.label; wrap.appendChild(lab);

  var box = document.createElement('div'); box.className = 'ms';
  var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ms-btn';
  function summary() { return !sel.length ? 'All' : (sel.length === 1 ? sel[0] : sel.length + ' selected'); }
  btn.textContent = summary();
  var panel = document.createElement('div'); panel.className = 'ms-panel'; panel.style.display = 'none';

  function opt(value, label, checked) {
    var row = document.createElement('label'); row.className = 'ms-opt';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = checked; cb.value = value;
    row.appendChild(cb); row.appendChild(document.createTextNode(' ' + label));
    return { row: row, cb: cb };
  }
  var allOpt = opt('__all__', 'All', !sel.length);
  panel.appendChild(allOpt.row);
  var cbs = [];
  members.forEach(function (m) {
    var o = opt(m, m, sel.indexOf(m) >= 0);
    cbs.push(o.cb); panel.appendChild(o.row);
  });

  function commit() {
    var chosen = cbs.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
    currentFilters[f.key] = chosen;
    sel = chosen;
    allOpt.cb.checked = !chosen.length;
    btn.textContent = summary();
    render();
  }
  allOpt.cb.onchange = function () {
    if (allOpt.cb.checked) { cbs.forEach(function (c) { c.checked = false; }); }
    commit();
  };
  cbs.forEach(function (c) { c.onchange = commit; });

  btn.onclick = function (e) {
    e.stopPropagation();
    var open = panel.style.display !== 'none';
    document.querySelectorAll('.ms-panel').forEach(function (p) { p.style.display = 'none'; });
    panel.style.display = open ? 'none' : 'block';
  };
  panel.onclick = function (e) { e.stopPropagation(); };
  box.appendChild(btn); box.appendChild(panel); wrap.appendChild(box);
  return wrap;
}

function collectDimValues(col) {

    mets.forEach(function(m) {
      var d = DOMAINS_BY_KEY[m.key]; if (!d || !d[col]) return;
      Object.keys(d[col]).forEach(function(v){ set[v] = true; });
    });
    var vals = Object.keys(set);
    // Fallback to global DOMAINS if per-key not yet populated (first load)
    return (vals.length ? vals : Object.keys(DOMAINS[col] || {})).sort();
  }
  var set = {}, list = [];
  mets.forEach(function(cfg) {
    var data = BOOT.metrics[cfg.sheet]; if (!data) return;

    data.rows.forEach(function(r) {
      var v = normalizeDimMember(col, r[ci] == null ? '(Unknown)' : String(r[ci]));
      if (v && !set[v]) { set[v] = true; list.push(v); }
    });
  });
  return list.sort();
}

function _worstRag(rags) {
  var order = { red:0, amber:1, green:2 }, worst = 'hold';
  rags.forEach(function (r) { if (worst === 'hold' || order[r] < order[worst]) worst = r; });
  return worst;
}
// One RAG verdict per SERIES THAT HAS A TARGET — including dimension members, which is what the
// detail table already shows a dot for. 'hold' (no resolvable target) is dropped, so the array
// length IS the number of dots the stage card draws, and the card cannot disagree with the table
// about how many targeted things a stage contains.
//
// This deliberately does NOT read a curated series list. Two rules were tried and both under-count:
// the primary alone made Acquisition & Activation show "3 on track" against a table with 9 targeted
// cells (it missed every per-channel row of tours_by_channel and 1b30d_by_channel), and an explicit
// ragSeries list is a second place to forget to update whenever the target sheet gains a row.
// Iterating m.series and letting rawTarget decide keeps the two views in sync by construction.
// (FPOPS-84)
//
// Consequence, intended: the stage headline is worst-of these, so a stage is now OFF TRACK when any
// targeted channel misses, not only when a metric total does. Acquisition & Activation flips from
// "ON TRACK · 3 green" to off-track because In House Sales (-14%) and Inside Sales (-19%) miss —
// visible in the table all along, just not on the card.
function metricRags(cfg) {
  if (!targetsValid()) return [];
  var lw = laggedWeek(cfg, 1);
  return computeMetric(cfg).series.map(function (s) {
    var st = periodStats(s, GRAN, lw);
    var tgt = bucketTargetVal(cfg, s, st.anchorDate || bucketStart(lw, GRAN), GRAN, st.yoy);
    return ragFor(st.latest, tgt, cfg.lowerIsBetter, cfg.hold);
  }).filter(function (r) { return r !== 'hold'; });
}
function stageRags(stage) {
  var out = [];
  METRIC_REGISTRY.filter(function (m) { return m.stage === stage && !m.hidden; })
    .forEach(function (cfg) { out = out.concat(metricRags(cfg)); });
  return out;
}
function stageRag(stage) { return _worstRag(stageRags(stage)); }
function stageRagCounts(stage) {
  var c = { green:0, amber:0, red:0 };
  stageRags(stage).forEach(function (r) { if (c[r] !== undefined) c[r]++; });

// Signature unchanged on purpose — the sidebar dots and renderStage read this and must not move.
function metricRag(cfg) { return _worstRag(metricRags(cfg)); }
function primarySeries(cfg, m) {

function render() {

  // with no series as a first-class case (kpiCard and drawSpark return early on a falsy series,
  // detailTable emits no rows, funnelHtml's stepSt returns null), so a partial paint is safe.
  prefetch(need, function () { _paintCancel(); paint(); }, function () { _paintSoon(paint); });
}

function granLabel() { return { week:'Weekly', month:'Monthly', quarter:'Quarterly', year:'Yearly' }[GRAN]; }

function funnelHtml() {
  // The bar is a QTD figure but its YoY used to be a SINGLE week's growth (periodStats.latest
  // vs .yoy), under a header that says QTD — the number and its comparison described different
  // periods. Both now come from one periodSet pair, exactly as detailRow does: the bar shows
  // `qtd` (through the in-progress week, which is what QTD means) and the YoY shows `qtdCmp`
  // (complete weeks on both sides). cur.boundaryDays day-matches the prior-year window.
  function stepSet(key, sk) {
    var cfg = REG_BY_KEY[key], m = computeMetric(cfg);
    var s = m.series.filter(function (x) { return x.key === sk; })[0]; if (!s) return null;
    var anchor = laggedAnchor(s, cfg, 1); if (!anchor) return null;
    var qEnd = qtdAnchor(s);
    var cur = periodSet(s, anchor, qEnd);
    var py  = periodSet(s, new Date(anchor.getTime() - 364 * 86400000),
                        qEnd ? new Date(qEnd.getTime() - 364 * 86400000) : null,
                        cur.boundaryDays);
    return { s: s, cfg: cfg, cur: cur, py: py };
  }
  // %-growth of the bar's own quantity, on the complete-weeks window. Every step reports a %
  // because every bar is an absolute — the 1B30D bar is a COUNT (online × rate), so its pp
  // rate-move would not describe it.
  function stepYoY(a, b) {
    if (a == null || b == null || !b) return null;
    return (a / b - 1) * 100;
  }
  var reg = stepSet('registrations', 'reg');
  var acq = stepSet('tours_by_channel', 'total');
  var act = stepSet('activities_activated', 'act');
  var b30 = stepSet('1b30d_by_channel', 'total');
  // 1B30D is a rate, so its bar is online-tours × rate. Both sides of the YoY are built the
  // same way, from qtdCmp — multiplying a QTD count by a single-week rate was the old mismatch.
  function b30Abs(acqV, rateV) { return (acqV != null && rateV != null) ? acqV * rateV / 100 : null; }
  var steps = [
    { label:'Registrations',         v: reg ? reg.cur.qtd : null,
      yoy: reg ? stepYoY(reg.cur.qtdCmp, reg.py.qtdCmp) : null },
    { label:'Activities Online',     v: acq ? acq.cur.qtd : null,
      yoy: acq ? stepYoY(acq.cur.qtdCmp, acq.py.qtdCmp) : null },
    { label:'1 Booking in 30d',      v: b30Abs(acq && acq.cur.qtd, b30 && b30.cur.qtd),
      yoy: (acq && b30) ? stepYoY(b30Abs(acq.cur.qtdCmp, b30.cur.qtdCmp),
                                  b30Abs(acq.py.qtdCmp,  b30.py.qtdCmp)) : null },
    { label:'Activated (3 reviews)', v: act ? act.cur.qtd : null,
      yoy: act ? stepYoY(act.cur.qtdCmp, act.py.qtdCmp) : null }
  ];
  var maxv = Math.max.apply(null, steps.map(function(s){ return s.v || 0; })) || 1;
  var W = 400, rowH = 88, gap = 12, vPad = 10;
  var svgH = vPad * 2 + steps.length * rowH + (steps.length - 1) * gap;
  var colors = ['#FA4F2D', '#f97316', '#fb923c', '#fdba74'];
  var fgColors = ['#fff', '#fff', '#1a0a00', '#1a0a00'];
  var fgMuted  = ['rgba(255,255,255,0.75)', 'rgba(255,255,255,0.75)', 'rgba(26,10,0,0.6)', 'rgba(26,10,0,0.6)'];
  var parts = ['<svg viewBox="0 0 ' + W + ' ' + svgH + '" preserveAspectRatio="xMidYMid meet" style="width:100%;max-height:500px;display:block">'];
  steps.forEach(function(s, i) {
    var prev = i > 0 ? steps[i-1].v : null;
    var conv = (prev != null && prev > 0 && s.v != null) ? Math.round(s.v / prev * 100) + '% of prev' : '';
    var ratio = (s.v != null && maxv > 0) ? Math.max(0.18, s.v / maxv) : 0.18;
    var w = ratio * (W - 40) + 40;
    var x = (W - w) / 2;
    var y = vPad + i * (rowH + gap);
    var fg = fgColors[i], fgm = fgMuted[i];
    var yoyStr = '';
    if (s.yoy != null) {
      var sign = s.yoy >= 0 ? '+' : '';
      yoyStr = ' · ' + sign + s.yoy.toFixed(1) + '% YoY';
    }
    parts.push(
      '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + rowH + '" rx="5" fill="' + colors[i] + '"/>',
      '<text x="' + (W/2) + '" y="' + (y + rowH/2 - 8) + '" text-anchor="middle" dominant-baseline="auto" font-size="18" font-weight="700" font-family="Century Gothic,Arial,sans-serif" fill="' + fg + '">' + (s.v != null ? Math.round(s.v).toLocaleString() : '—') + '</text>',
      '<text x="' + (W/2) + '" y="' + (y + rowH/2 + 13) + '" text-anchor="middle" dominant-baseline="auto" font-size="12" font-family="Century Gothic,Arial,sans-serif" fill="' + fg + '">' + s.label + (conv ? ' · ' + conv : '') + '</text>',
      '<text x="' + (W/2) + '" y="' + (y + rowH/2 + 30) + '" text-anchor="middle" dominant-baseline="auto" font-size="11" font-family="Century Gothic,Arial,sans-serif" fill="' + fgm + '">' + yoyStr + '</text>'
    );
  });
  parts.push('</svg>');
  return '<div style="padding:16px 20px 20px">' +
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dark-2);margin-bottom:12px">' +
      'Supply Funnel · QTD · ' + quarterLabelFromDate(bucketStart(selectedWeek, 'week')) +
    '</div>' + parts.join('') + '</div>';
}

function adminTableHtml(r, which) {
  if (!r || r.error) return 'Access denied.';
  var rows = r.rows || [], heads = r.headers || [];
  // Feedback free text is user-submitted and lands in an admin's browser — escape it.
  var esc = function (v) {
    return String(v == null ? '' : v).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  };
  var ix = {}; heads.forEach(function (h, i) { ix[h] = i; });
  var cols, cells;
  if (which === 'feedback') {
    cols = FB_COMPACT.concat(['Details']);
    cells = function (row) {
      return FB_COMPACT.map(function (h) { return esc(row[ix[h]]); }).concat([
        FB_DETAIL.map(function (h) {
          var v = row[ix[h]];
          return v ? '<em>' + esc(h.slice(3)) + ':</em> ' + esc(v) : '';
        }).filter(Boolean).join('<br>')
      ]);
    };
  } else {
    cols = heads;
    cells = function (row) { return heads.map(function (h, i) { return esc(row[i]); }); };
  }
  var ei = ix.Email >= 0 ? ix.Email : 1;
  var unique = Object.keys(rows.reduce(function (m, row) { m[row[ei]] = 1; return m; }, {})).length;
  var html = '<p style="margin:0 0 12px;font-size:13px"><strong>' + rows.length + '</strong> '
           + (which === 'feedback' ? 'submissions' : 'events')
           + ' &nbsp;\xb7&nbsp; <strong>' + unique + '</strong> unique users</p>'
           + '<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="border-bottom:2px solid #e5e7eb">'
           + cols.map(function (h) { return '<th style="padding:4px 8px;text-align:left">' + esc(h) + '</th>'; }).join('')
           + '</tr></thead><tbody>';
  rows.slice().reverse().forEach(function (row) {
    html += '<tr style="border-bottom:1px solid #f3f4f6">'
          + cells(row).map(function (c) { return '<td style="padding:4px 8px;vertical-align:top">' + c + '</td>'; }).join('')
          + '</tr>';
  });
  return html + '</tbody></table>';
}

// ── Compare tab ───────────────────────────────────────────────────────────────
// The fully dynamic surface: pick a metric, a dimension and which members to show.
// Everything below is a thin shell over compareGridHtml/cmpDraw — the same engine the
// tile ⊞ uses, so the two can never disagree about what a cut means.
//
// State lives on the function object, not a module-scope var: the vm-sandbox harnesses
// only get hoisted function declarations, so a shared var reads undefined there.
function cmpState() {
  var h = cmpState;
  if (!h._v) h._v = { metric: null, dim: null, members: null, series: null };
  if (!h._v.metric) {
    var first = METRIC_REGISTRY.filter(function (m) { return !m.hidden && !m.noDims; })[0];
    h._v.metric = first ? first.key : (METRIC_REGISTRY[0] || {}).key;
  }
  return h._v;
}
function setCmpMetric(k) {
  var st = cmpState();
  if (st.metric === k) return;
  st.metric = k; st.dim = null; st.members = null; st.series = null;   // dims differ per metric
  render();
}
function setCmpDim(col) {
  var st = cmpState();
  if (st.dim === col) return;
  st.dim = col; st.members = null;                                      // members differ per dim
  render();
}
function toggleCmpMember(val) {
  var st = cmpState(), cfg = REG_BY_KEY[st.metric];
  var all = collectDimValuesFor(cfg, cmpActiveDim(cfg));
  var cur = st.members || all.slice();
  var i = cur.indexOf(val);
  if (i >= 0) cur = cur.filter(function (v) { return v !== val; });
  else cur = all.filter(function (v) { return cur.indexOf(v) >= 0 || v === val; });  // keep domain order
  st.members = cur;
  render();
}
function setCmpAllMembers(on) {
  var st = cmpState(), cfg = REG_BY_KEY[st.metric];
  st.members = on ? collectDimValuesFor(cfg, cmpActiveDim(cfg)).slice() : [];
  render();
}
function setCmpSeries(k) { cmpState().series = k; render(); }

// Resolve the dimension actually in use — the chosen one if it is still valid for this
// metric, else the metric's first available dimension.
function cmpActiveDim(cfg) {
  var st = cmpState(), opts = cmpDimOptions(cfg);
  if (st.dim && opts.some(function (o) { return o.col === st.dim; })) return st.dim;
  return (opts[0] || {}).col || null;
}

function renderCompare(host) {
  // logVisit is a SERVER function (Code.gs) — it must go through google.script.run, and is
  // absent in local preview. Same guard renderStage uses; a bare call throws a
  // ReferenceError and takes the whole tab down.
  try {
    if (SERVER_MODE && window.google && google.script && google.script.run &&
        typeof google.script.run.logVisit === 'function')
      google.script.run.logVisit('tab_view', 'compare', selectedWeek || '', GRAN);
  } catch (e) {}
  var st = cmpState();
  var cfg = REG_BY_KEY[st.metric];
  if (!cfg) { host.innerHTML = section('cmp-main', 'Compare', '<div class="msg">No metric selected.</div>'); return; }

  var metricSel = '<select onchange="setCmpMetric(this.value)" style="font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:4px">' +
    METRIC_REGISTRY.filter(function (m) { return !m.hidden; }).map(function (m) {
      return '<option value="' + cmpEsc(m.key) + '"' + (m.key === st.metric ? ' selected' : '') + '>' + cmpEsc(m.label) + '</option>';
    }).join('') + '</select>';

  var dim = cmpActiveDim(cfg);
  if (!dim) {
    host.innerHTML = section('cmp-main', 'Compare',
      '<div class="cmp-bar" style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
      '<span style="font-size:11px;color:#6b7280">Metric</span>' + metricSel + '</div>' +
      '<div class="msg" style="padding:10px 4px;color:#9ca3af;font-size:13px">' +
      cmpEsc(cfg.label) + ' has no dimensions to cut by.</div>');
    return;
  }

  var all = collectDimValuesFor(cfg, dim);
  var sel = st.members || all.slice();
  sel = sel.filter(function (v) { return all.indexOf(v) >= 0; });        // stale members after a dim change
  var cost = cmpCost(cfg, dim, sel);

  // Which series of the metric the panels show (GMV has total / TP / DG).
  var m = computeMetric(cfg);
  var pickable = (m.series || []).filter(function (s) { return !s.isDim; });
  var activeSeries = st.series && pickable.some(function (s) { return s.key === st.series; })
    ? st.series : (pickable[0] || {}).key;
  var seriesChips = pickable.length > 1
    ? '<div class="series-toggle" style="margin:6px 0">' + pickable.map(function (s) {
        return '<button class="series-chip' + (s.key === activeSeries ? ' active' : '') +
          '" onclick="setCmpSeries(\'' + cmpEsc(s.key) + '\')">' + cmpEsc(s.label) + '</button>';
      }).join('') + '</div>'
    : '';

  var checks = all.map(function (v) {
    return '<label class="ms-opt" style="display:inline-flex;align-items:center;gap:4px;margin-right:10px">' +
      '<input type="checkbox"' + (sel.indexOf(v) >= 0 ? ' checked' : '') +
      ' onchange="toggleCmpMember(' + JSON.stringify(v).replace(/"/g, '&quot;') + ')"> ' + cmpEsc(v) + '</label>';
  }).join('');

  var controls =
    '<div class="cmp-bar" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
      '<span style="font-size:11px;color:#6b7280">Metric</span>' + metricSel +
      '<span style="font-size:11px;color:#6b7280;margin-left:8px">Cut by</span>' +
      cmpDimSelect(cfg, dim, 'setCmpDim(this.value)') +
      '<button class="series-chip" onclick="setCmpAllMembers(true)">All</button>' +
      '<button class="series-chip" onclick="setCmpAllMembers(false)">None</button>' +
    '</div>' + seriesChips +
    '<div style="font-size:11px;color:#4b5563;margin-bottom:6px">' + checks + '</div>' +
    '<div style="font-size:11px;color:#9ca3af;margin-bottom:10px">' +
      sel.length + ' of ' + all.length + ' selected · ' +
      (cmpIsFreeDim(cfg, dim)
        ? 'already loaded, no extra fetch'
        : cost.n === 0 ? 'all cached, loads instantly'
        : 'about ' + (cost.secs < 1 ? 1 : Math.round(cost.secs)) + 's to load ' + cost.n + ' cut' + (cost.n === 1 ? '' : 's')) +
    '</div>';

  var gridId = 'cmpg-tab';
  var dimLabel = (cmpDimOptions(cfg).filter(function (d) { return d.col === dim; })[0] || {}).label || dim;
  host.innerHTML = section('cmp-main', 'Compare — ' + cfg.label + ' by ' + dimLabel + ' (' + granLabel() + ')',
    controls + compareGridHtml(cfg, dim, sel, gridId, activeSeries) + footnote(L12W_NOTE));
  cmpDraw(cfg, dim, sel, gridId, activeSeries);
}

function kpiCard(cfg, s, h) {
  if (!s) return '';
  var lw = laggedWeek(cfg, 1);
  var st = periodStats(s, GRAN, lw);
  var refDate = st.anchorDate || bucketStart(lw, GRAN);
  var tgt = targetsValid() ? bucketTargetVal(cfg, s, refDate, GRAN, st.yoy) : null;
  var basis = st.latest;
  var rag = ragFor(basis, tgt, cfg.lowerIsBetter, cfg.hold);
  var yoy = deltaInfo(st.latest, st.yoy, s.fmt, cfg.lowerIsBetter);
  var sparkId = h ? ('spark-' + cfg.key + '-' + (h.series || s.key)) : ('spark-' + cfg.key);
  var cardLabel = (h && h.cardLabel) || cfg.label;
  // The headline is the last COMPLETE bucket (periodStats anchors at laggedWeek(cfg,1)), and
  // every badge beside it refers to that bucket. The still-running week is shown next to it —
  // the same pair the detail table calls "Last Complete Wk" / "Curr Week" — so the freshest
  // reading stays visible without anything comparing it. Deliberately no YoY, target or RAG on
  // it: comparing a part-week against a full prior-year week is what this change removes.
  // Week grain only — at month/quarter/year the anchor bucket IS the current partial one, so a
  // separate "in progress" figure would be meaningless.
  var wip = null;
  if (GRAN === 'week' && st.anchorDate) {
    var _selD = bucketStart(selectedWeek, 'week');
    if (_selD > st.anchorDate) {
      var _wipV = resolveAgg(s, aggRange(s, _selD, _selD), true);
      if (_wipV != null) wip = { val:_wipV, label:bLabel(_selD, 'week') };
    }
  }
  var cardHeader = '<div class="kpi-card rag-' + rag + '" data-comment-target="kpi:' + cfg.key + '" data-view="' + currentView + '">' +
    '<div class="kpi-label">' + cardLabel + shareBtn('kpi:' + cfg.key) + '</div>' +
    '<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">' +
      '<div>' +
        '<div class="kpi-value">' + fmtVal(st.latest, s.fmt) + '</div>' +
        '<div class="kpi-sub">' + (st.anchorDate ? bLabel(st.anchorDate, GRAN) : '—') + (cfg.lagWeeks ? ' · ' + cfg.lagWeeks + 'w lag' : '') + '</div>' +
      '</div>' +
      (wip ? '<div style="opacity:.5">' +
        '<div class="kpi-value" style="font-size:19px">' + fmtVal(wip.val, s.fmt) + '</div>' +
        '<div class="kpi-sub">' + wip.label + ' · in progress</div>' +
      '</div>' : '') +
    '</div>';
  // Yearly view: no sparkline — show prior-year comparison block instead
  if (GRAN === 'year') {
    return cardHeader +
      '<div class="kpi-year-compare">' +
        '<div class="kpi-yc-row"><span class="kpi-yc-val">' + fmtVal(st.yoy, s.fmt) + '</span><span class="kpi-yc-lbl">Prior year</span></div>' +
      '</div>' +
      '<div class="kpi-badges">' +
        '<div class="badge-wrap"><span class="badge ' + yoy.cls + '">' + yoy.text + '</span><span class="badge-sub">YoY</span></div>' +
        (tgt != null ? '<div class="badge-wrap"><span class="badge ' + (rag === 'green' ? 'pos' : rag === 'red' ? 'neg' : 'neu') + '">' + fmtVal(tgt, s.fmt) + '</span><span class="badge-sub">Target</span></div>' : '') +
      '</div></div>';
  }
  var pop = deltaInfo(st.latest, st.pop, s.fmt, cfg.lowerIsBetter);
  var popLbl = { week:'WoW', month:'MoM', quarter:'QoQ', year:'YoY' }[GRAN];
  var anc = laggedAnchor(s, cfg, 1);
  var l12yoy = null;
  if (anc) {
    var _l12 = l12wAbs(s, anc);
    var _l12py = l12wAbs(s, new Date(anc.getTime() - 364 * 86400000));
    l12yoy = deltaInfo(_l12, _l12py, s.fmt, cfg.lowerIsBetter);
  }
  return cardHeader +
    '<div class="kpi-badges">' +
      '<div class="badge-wrap"><span class="badge ' + yoy.cls + '">' + yoy.text + '</span><span class="badge-sub">YoY</span></div>' +
      '<div class="badge-wrap"><span class="badge ' + pop.cls + '">' + pop.text + '</span><span class="badge-sub">' + popLbl + '</span></div>' +
      (l12yoy ? '<div class="badge-wrap"><span class="badge ' + l12yoy.cls + '">' + l12yoy.text + '</span><span class="badge-sub">L12W YoY</span></div>' : '') +
      (tgt != null ? '<div class="badge-wrap"><span class="badge ' + (rag === 'green' ? 'pos' : rag === 'red' ? 'neg' : 'neu') + '">' + fmtVal(tgt, s.fmt) + '</span><span class="badge-sub">Target</span></div>' : '') +
    '</div>' +
    '<div class="trend-canvas-box" style="height:70px"><canvas id="' + sparkId + '"></canvas></div></div>';
}

function metricBlock(cfg) {
  var m = computeMetric(cfg);
  if (!m.series || !m.series.length) {                   // empty (errored / unsupported combo) → graceful placeholder, never crash the view
    // Under progressive paint an unfetched metric also lands here, and "No data" would be a lie —
    // metricPending() tells the two apart (prefetch caches [] on failure, so an ABSENT key is
    // still-loading).
    // The server explains an impossible cut (Code.gs _aggMarginals); prefer its reason
    // over the generic line, which reads as a data outage rather than a known limit.
    var why = _seriesNote(cfg.key + '|' + filterSig());
    var msg = metricPending(cfg)
      ? '<span class="spinner"></span>Loading…'
      : why ? '⚠ ' + why + ' Pick one dimension, or choose another metric.'
      : 'No data for this metric under the current filter.';
    return '<div class="metric-block" data-comment-target="metric:' + cfg.key + '" data-view="' + currentView + '">' +
      '<div class="metric-head"><span class="metric-name">' + cfg.label + '</span></div>' +
      '<div class="msg" style="padding:10px 4px;color:#9ca3af;font-size:13px">' + msg + '</div></div>';
  }
  var activeKey = _blockSeries[cfg.key] || primarySeries(cfg, m).key;
  var active = m.series.filter(function (x) { return x.key === activeKey; })[0] || m.series[0];
  var chips;
  if (cfg.multiLine || cfg.mirrorBar) {
    chips = m.series.map(function(s) {
      return '<span class="series-chip active" style="cursor:default">' + s.label + '</span>';
    }).join('');
  } else {
    chips = m.series.map(function (s) {
      return '<button class="series-chip' + (s.key === activeKey ? ' active' : '') + '" data-series-key="' + s.key + '" onclick="setBlockSeries(\'' + cfg.key + '\',\'' + s.key + '\')">' + s.label + '</button>';
    }).join('');
  }
  var badges = (cfg.lagWeeks ? '<span class="metric-lag">' + cfg.lagWeeks + 'w maturity lag</span>' : '') +
    (cfg.noDims ? '<span class="metric-hold">Global filters have no effect</span>' : '');
  function statBox(label, valueHtml, cls, hint) {
    return '<div class="stat"' + (hint ? ' title="' + hint + '"' : '') + '><span class="stat-label">' + label + '</span><span class="stat-value ' + (cls || '') + '">' + valueHtml + '</span></div>';
  }
  // vsTargetText already emits the right suffix per mode, but nothing on screen said WHICH mode
  // produced it — a 'pp' gap and a '%' ratio look interchangeable side by side. (FPOPS-81)
  var TGT_MODE_HINT = {
    growthpp: 'Growth vs plan, in percentage points (actual YoY growth − planned YoY growth)',
    pp:       'Difference vs target, in percentage points',
    pp1:      'Difference vs target, in percentage points',
    abs:      'Absolute difference vs target',
    pct:      'Difference vs target, as a % of target'
  };
  // L12W rollup: absolute · YoY · prior-year YoY (Yo2Y) · vs Target (total-level only).
  var stats = '';
  if (active) {
    // minLag 1 — MUST match kpiCard's L12W badge (same window, same number). Without it this
    // row's 12th week was the still-running one, charged against a full prior-year week: the
    // YoY read ~20pp low on fast-growing metrics and drifted upward as the week filled in.
    // All four stats below key off `anc`, so they move together.
    var anc = laggedAnchor(active, cfg, 1);
    if (anc) {
      var l12   = l12wAbs(active, anc);
      var l12py = l12wAbs(active, new Date(anc.getTime() - 364 * 86400000));
      var l12p2 = l12wAbs(active, new Date(anc.getTime() - 728 * 86400000));
      var yoy   = deltaInfo(l12, l12py, active.fmt, cfg.lowerIsBetter);      // L12W vs prior-year L12W
      var pyYoY = deltaInfo(l12py, l12p2, active.fmt, cfg.lowerIsBetter);    // prior-year's own YoY (Yo2Y)
      var ti12  = l12wTargetInfo(cfg, active, anc, l12py);
      stats = statBox('L12W', fmtVal(l12, active.fmt)) +
              statBox('YoY', yoy.text, yoy.cls) +
              statBox('PY YoY', pyYoY.text, pyYoY.cls) +
              (ti12 ? statBox('vs Target', vsTargetText(l12, ti12.value, ti12.mode, ti12) + ragDot(ragFor(l12, ti12.value, ti12.direction === 'lower', false)),
                              '', TGT_MODE_HINT[ti12.mode] || '') : '');
    }
  }
  // ⊞ swaps this tile's single chart for a grid of the same metric cut N ways. No chart is
  // added to the page — the existing one is replaced, and ⊟ puts it back. Tiles whose chart
  // is not a single series (multiLine/mirrorBar) or which carry no dimensions have nothing
  // to cut, so they get no button.
  var canCmp = !cfg.noDims && !cfg.multiLine && !cfg.mirrorBar && cmpDimOptions(cfg).length > 0;
  var openDim = canCmp ? _cmpOpen[cfg.key] : null;
  var cmpBtn = canCmp
    ? '<button class="share-btn" title="' + (openDim ? 'Back to one chart' : 'Compare cuts side by side') +
      '" onclick="toggleCompare(\'' + cfg.key + '\')" style="background:none;border:none;cursor:pointer;' +
      'font-size:13px;padding:0 4px;opacity:.65">' + (openDim ? '⊟' : '⊞') + '</button>'
    : '';
  var body;
  if (openDim) {
    var mem = collectDimValuesFor(cfg, openDim);
    body = '<div class="cmp-bar" style="display:flex;align-items:center;gap:8px;margin:6px 0 10px">' +
      '<span style="font-size:11px;color:#6b7280">Cut by</span>' +
      cmpDimSelect(cfg, openDim, 'toggleCompare(\'' + cfg.key + '\', this.value)') +
      '<span style="font-size:11px;color:#9ca3af">' + mem.length + ' cut' + (mem.length === 1 ? '' : 's') +
      (cmpIsFreeDim(cfg, openDim) ? ' · no extra fetch' : '') + '</span></div>' +
      compareGridHtml(cfg, openDim, mem, 'cmpg-' + cfg.key, activeKey);
  } else {
    body = '<div class="trend-canvas-box"><canvas id="trend-' + cfg.key + '"></canvas></div>';
  }
  return '<div class="metric-block" data-comment-target="metric:' + cfg.key + '" data-view="' + currentView + '"><div class="metric-head"><span class="metric-name">' + cfg.label + '</span>' + shareBtn('metric:' + cfg.key) + cmpBtn + badges +
    '<div class="metric-stats">' + stats + '</div></div><div class="series-toggle">' + chips +
    '</div>' + body + '</div>';
}

// Dimension picker. A plain <select> — native, keyboard-accessible, zero CSS, and unlike
// the .ms multi-select it is single-choice by nature, which is what a cut axis is.
function cmpDimSelect(cfg, cur, onchange) {
  var opts = cmpDimOptions(cfg).map(function (d) {
    return '<option value="' + cmpEsc(d.col) + '"' + (d.col === cur ? ' selected' : '') + '>' +
           cmpEsc(d.label) + '</option>';
  }).join('');
  return '<select onchange="' + onchange + '" style="font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:4px">' + opts + '</select>';
}

// Open/close the compare grid on a tile, or switch which dimension it cuts by.
function toggleCompare(metricKey, dimCol) {
  var cfg = REG_BY_KEY[metricKey]; if (!cfg) return;
  if (dimCol) _cmpOpen[metricKey] = dimCol;
  else if (_cmpOpen[metricKey]) delete _cmpOpen[metricKey];
  else _cmpOpen[metricKey] = (cmpDimOptions(cfg)[0] || {}).col;
  render();
}
function setBlockSeries(metricKey, seriesKey) {
  _blockSeries[metricKey] = seriesKey;
  var cfg = REG_BY_KEY[metricKey]; if (!cfg) return;
  if (cfg.multiLine || cfg.mirrorBar) return;
  var m = computeMetric(cfg); if (!m || !m.series || !m.series.length) return;
  var s = m.series.filter(function(x){ return x.key === seriesKey; })[0] || primarySeries(cfg, m);
  var block = document.querySelector('[data-comment-target="metric:' + metricKey + '"]');
  if (block) {
    block.querySelectorAll('.series-chip[data-series-key]').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-series-key') === seriesKey);
    });
  }
  var canvasId = 'trend-' + metricKey;
  if (_charts[canvasId]) { try { _charts[canvasId].destroy(); } catch(e){} delete _charts[canvasId]; }
  drawTrend(canvasId, cfg, s);
}

// ── Detail table = WBR memo format ────────────────────────────────────────────
// Columns: Curr Week · Last Complete Wk (LCW) · LCW YoY · LCW vs Target · L4CW avg
// · L4CW YoY · L4CW vs Target · QTD actuals · QTD YoY · QTD vs Target. Weekly by
// construction (independent of the granularity toggle).
//   Curr Week = the selected/latest week's raw value — may be in-progress, so it
//              carries no comparison. Leftmost data column.
//   LCW       = last COMPLETE (mature) week = the maturity-lag-adjusted anchor;
//              carries YoY + vs-Target. For non-lagged metrics it coincides with
//              Curr Week (nothing immature to distinguish).
//   L4CW      = the 4 complete weeks ending at LCW.   QTD = quarter-to-date thru LCW.
// Rates roll up Σnum/Σden; counts sum for QTD, average for L4CW.
function aggRange(s, fromDate, toDate, weeklyMap) {
  var wm = weeklyMap || s.weekly;
  var acc = { sum:0, n:0, num:0, den:0, any:false, last:null, lastAt:null };
  Object.keys(wm).forEach(function (w) {
    var v = wm[w]; if (v === null || v === undefined) return;
    var d = parseD(w); if (isNaN(d.getTime())) return;
    if (d >= fromDate && d <= toDate) {
      acc.any = true;
      if (s.kind === 'wrate') { acc.num += (v.num || 0); acc.den += (v.den || 0); }
      else { acc.sum += Number(v); acc.n++; }
      // Latest in-window observation, for timeAgg 'last' (stock metrics).
      if (!acc.lastAt || d > acc.lastAt) { acc.lastAt = d; acc.last = v; }
    }
  });
  return acc;
}
// `kind` is the server's CROSS-DIMENSION roll-up (how dim rows combine within one week).
// `timeAgg` is the ACROSS-TIME roll-up (how weeks combine). They coincide for counts and GMV, so
// timeAgg defaults to 'sum' and nothing changes — but they must differ for:
//   'mean' → a rate that is summed across dims but must be averaged across weeks. price_coverage is
//            SUM(pct) across dims (~27% per week, correct); summing 4 weeks gave a "135.0%" QTD.
//   'last' → a stock. unprocessed_tours is a week-end backlog; summing levels is meaningless.
// Only the wantSum callers (lw, qtd, qtdCmp, l12wAbs) consult it; L4CW already averages. A one-week
// window is identical under all three, so the LCW cell can never move.
function timeAggOf(s) { return s.timeAgg || 'sum'; }
function resolveAgg(s, acc, wantSum) {
  if (!acc.any) return null;
  if (s.kind === 'wrate') return acc.den ? acc.num / acc.den * 100 : null;
  if (s.kind === 'mean')  return acc.n ? acc.sum / acc.n : null;
  if (wantSum) {
    var ta = timeAggOf(s);
    if (ta === 'last') return acc.last === null ? null : Number(acc.last);
    if (ta === 'mean') return acc.n ? acc.sum / acc.n : null;
  }
  return wantSum ? acc.sum : (acc.n ? acc.sum / acc.n : null);   // sum kind
}
// anchor = latest week with data at/earlier than (selectedWeek − maturity lag)
function laggedAnchor(s, cfg, minLag) {
  var sel = parseD(selectedWeek);
  var lag = (((cfg && cfg.lagWeeks) || 0) + (minLag || 0));
  // Use lag*7-6 so the cut lands 1 day before sel for lag=1, capturing non-Monday
  // quarter-boundary entries (e.g. 2026-07-01 is only 6 days before 2026-07-07).
  var cut = lag > 0 ? new Date(sel.getTime() - (lag * 7 - 6) * 86400000) : sel;
  var anchor = null, fallback = null;
  Object.keys(s.weekly).forEach(function (w) {
    var v = s.weekly[w]; if (v === null || v === undefined) return;
    if (s.kind === 'wrate' && !(v && v.den)) return;
    var d = parseD(w); if (isNaN(d.getTime())) return;
    if (!fallback || d > fallback) fallback = d;
    if (d <= cut && (!anchor || d > anchor)) anchor = d;
  });
  return anchor || fallback;
}
// QTD end = latest week with data at/before the selected week, with NO maturity lag.
// Reuses laggedAnchor's null / zero-den skipping, so lagged metrics still land on their
// last week that actually carries data.
function qtdAnchor(s) { return laggedAnchor(s, null, 0); }
// Advance a Monday-grain date to the latest quarter-split bucket INSIDE ITS OWN WEEK. The split grain
// partitions the straddling week (verified exact on num AND den: 464+910=1374, 939+2093=3032 for
// 1b30d week 2026-03-30), so the quarter-boundary bucket always lives in [W, W+6].
//
// Why this exists: periodSet SUMS QTD over the split grain but used to DECIDE the quarter from Monday
// dates. A cohort metric's straddling week is keyed 2026-06-29 = Q2, so a complete Q3 bucket
// (2026-07-01, Jul 1-5) was excluded and the QTD column showed a full Q2 figure in August.
//
// Used ONLY for the quarter decision and the QTD window edges. It must NEVER become `anchor`: a
// non-Monday date fed to aggRange(s, anchor, anchor) — which defaults to the MONDAY map — matches no
// key, returns null, and blanks LCW, L4CW, both YoY cells and both vs-Target cells.
//
// Identity-safe by construction (`best` starts at `d`): no qtd_weekly -> returns d; qtd_weekly present
// but no non-Monday bucket in that week -> the only candidate in [W, W+6] is W itself -> returns d. So
// every metric without a split bucket in the anchor's week is bit-identical to before.
function qGrainEdge(s, d) {
  var qwm = s.qtd_weekly; if (!qwm) return d;
  var lim = new Date(d.getTime() + 6 * 86400000), best = d;
  Object.keys(qwm).forEach(function (w) {
    var v = qwm[w]; if (v === null || v === undefined) return;
    if (s.kind === 'wrate' && !(v && v.den)) return;   // same zero-den skip as laggedAnchor
    var wd = parseD(w); if (isNaN(wd.getTime())) return;
    if (wd >= d && wd <= lim && wd > best) best = wd;
  });
  return best;
}
// QTD is "to date": it runs through the latest week WITH DATA, including the in-progress
// one. LCW/L4CW keep the maturity-lagged anchor because they report *complete* weeks.
// qtdEnd defaults to anchor for callers that don't care.
// Days covered by the quarter-boundary bucket: qStart through the Sunday before the next
// Monday. Wed 2026-07-01 -> 5 (Jul 1-5), Tue 2025-07-01 -> 6 (Jul 1-6), Monday qStart -> 7.
// Same idiom as the week-stepping in qtdTargetInfo.
function qBoundaryDays(qStart) { return ((8 - qStart.getUTCDay()) % 7) || 7; }

// `wantBoundaryDays` day-matches this window against another one. Quarters don't start on
// Mondays, and the 364-day prior-year shift preserves the Monday alignment but NOT the
// weekday of the quarter start — Q3 begins Wed in 2026 (boundary bucket = 5 days) and Tue in
// 2025 (6 days). Every later week is 7-vs-7, so the whole YoY asymmetry sits in that one
// bucket: uncorrected, PY spanned 27 days against the current 26 and inflated the base by
// ~3.8%. Callers compute the current window first, then pass its `boundaryDays` to the PY call.
function periodSet(s, anchor, qtdEnd, wantBoundaryDays) {
  var end = qtdEnd || anchor;
  // Both QTD windows must sit in the SAME quarter — the one `end` falls in. Deriving the
  // comparison window's start from `anchor` instead put it in the PREVIOUS quarter during
  // the first week or two of a new quarter (anchor is lag-adjusted, so it can still be in
  // Q(N-1) while end is already in Q(N)), making QTD YoY compare Q(N)-to-date against a
  // full Q(N-1)-to-date figure.
  // The quarter follows the DATA EDGE (`eSplit`) for every metric, lagged or not. `qEndEff` already
  // runs to the data edge, so taking `qStart` from the lag-shifted `anchor` instead was internally
  // inconsistent: it clamped the window back to the mature week's quarter and threw away the very
  // data the actual is meant to include. Concretely, at CW32 a lag-5 cohort metric had `anchor` in
  // week Jun 22 while its complete Q3 bucket sat in week Jun 29 — so the QTD column reported a full
  // **Q2** figure in August. (This gate previously existed so a lagged metric's actual and target
  // described the same quarter. That is safe to drop: the target sheet has no Q(N-1)|CW(boundary) row
  // — 1b30d runs Q2=CW14-26, Q3=CW27-39 — so rawTarget's 'Q2|27' misses and its 'cw27' alias already
  // resolves to the same Q3 cell 'Q3|27' would hit.)
  //
  // The maturity lag now governs only what it should: LCW/L4CW, the chart window, and `cmpEnd` below —
  // which is why QTD YoY and vs Target go blank for ~1 week after a quarter boundary, when no COMPLETE
  // week has landed in the new quarter yet. That is the honest answer, not last quarter's number.
  //
  // BOTH edges go through qGrainEdge first, so the quarter decision can see the quarter-split grain.
  // Without it, the straddling week is keyed on its Monday (2026-06-29 = Q2) and a complete Q3 bucket
  // (2026-07-01) is invisible. Identity for any series with no split bucket in that week, so nothing
  // else moves. `anchor` itself is deliberately NOT reassigned — see qGrainEdge.
  var aSplit = qGrainEdge(s, anchor), eSplit = qGrainEdge(s, end);
  var qAnchor = eSplit;
  var qStart = new Date(Date.UTC(qAnchor.getUTCFullYear(), Math.floor(qAnchor.getUTCMonth() / 3) * 3, 1));
  var ownDays = qBoundaryDays(qStart);
  var qwm = s.qtd_weekly || s.weekly;
  // Pro-rate the boundary bucket only when the TIME axis is additive. A `wrate` bucket is
  // {num,den} and scaling both leaves the rate identical, so day-matching cannot fix a rate on
  // this grain; a `mean` is already rate-like; and a stock (`timeAgg:'last'`) is a level, not a
  // quantity accrued over days. All three are left as-is, knowingly.
  if (wantBoundaryDays && wantBoundaryDays !== ownDays && s.kind === 'sum' && timeAggOf(s) === 'sum') {
    var bKeyStr = isoOf(qStart), bVal = qwm[bKeyStr];
    if (bVal !== null && bVal !== undefined) {
      var scaled = {};
      Object.keys(qwm).forEach(function (w) { scaled[w] = qwm[w]; });
      scaled[bKeyStr] = Number(bVal) * (wantBoundaryDays / ownDays);
      qwm = scaled;
    }
  }
  // QTD actuals run through the latest week WITH DATA for every metric — the rule lag-0 metrics
  // have always followed, and the convention Looker and the memo use. A maturity lag says which
  // weeks are *final* (that governs LCW/L4CW and the qtdCmp pair below), not which weeks exist;
  // stopping the actual at `anchor` silently dropped 2 of the 4 Q3 weeks on curation_duration.p90
  // (mean of Jul 6 + Jul 13 only = 1.9d, against Looker's 1.4d over Jul 6-27).
  // Clamped to qStart's quarter: for a lagged metric qStart comes from `anchor`, which early in a
  // quarter can still sit in Q(N-1) while `end` is already in Q(N) — unclamped, a lag-5 metric's
  // QTD would span both. Floored at `anchor` so the window can never come out SHORTER than the
  // mature one, which laggedAnchor's newest-week fallback can otherwise produce (anchor > end).
  var qNext = new Date(Date.UTC(qStart.getUTCFullYear(), qStart.getUTCMonth() + 3, 1));
  // Never SHORTER than the mature window (laggedAnchor's newest-week fallback can put `anchor` past
  // `end`), and never spilling past the quarter — clamp last so the floor cannot reintroduce a spill.
  var qEndEff = aSplit > eSplit ? aSplit : eSplit;
  if (qEndEff >= qNext) qEndEff = new Date(qNext.getTime() - 86400000);
  // qtdCmp must be a SUBSET of qtd. laggedAnchor falls back to the newest week when nothing is
  // older than its maturity cut, which can put `anchor` past `end` — and then the comparison
  // window ran beyond the actual it labels, possibly into the next quarter.
  // On the split edge, so a complete quarter-boundary bucket compares Q(N) against Q(N) instead of
  // going null. Safe for the target read: the target sheet has no Q(N-1)|CW(boundary) row — 1b30d runs

function regionConfirmed() { if (!regionConfirmed._v) regionConfirmed._v = {}; return regionConfirmed._v; }
function regionLoadAnyway(region) {

function loadRegionTable(region) {

    jobs.forEach(function (j) {

// aggregate a series over the visible window buckets (Σ for counts, weighted/mean for rates)
function windowAgg(s, buckets, win) {
  if (!buckets) return null;
  if (s.kind === 'sum') { var acc = 0, any = false; win.forEach(function (b) { if (buckets[b.key] != null) { acc += buckets[b.key]; any = true; } }); return any ? acc : null; }
  var vals = win.map(function (b) { return buckets[b.key]; }).filter(function (v) { return v != null; });
  return vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
}

// ── Charts ────────────────────────────────────────────────────────────────────
function destroyCharts() { Object.keys(_charts).forEach(function (id) { try { _charts[id].destroy(); } catch (e) {} }); _charts = {}; }

// Inline last-value label plugin — avoids a CDN dependency.
// Reads dataset.datalabels = { display: true|fn, color, formatter } per dataset.
var _datalabelsRegistered = false;
function _ensureDatalabels() {
  if (_datalabelsRegistered || typeof Chart === 'undefined') return;
  _datalabelsRegistered = true;
  Chart.register({
    id: 'supplyDatalabels',
    afterDatasetsDraw: function(chart) {
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function(dataset, di) {
        var dl = dataset.datalabels; if (!dl) return;
        var meta = chart.getDatasetMeta(di);
        meta.data.forEach(function(element, ei) {
          var val = dataset.data[ei]; if (val == null) return;
          var show = typeof dl.display === 'function' ? dl.display({ dataIndex:ei }) : !!dl.display;
          if (!show) return;
          var label = dl.formatter ? dl.formatter(val) : String(val); if (!label) return;
          ctx.save();
          ctx.font = '700 9px Century Gothic,Arial,sans-serif';
          ctx.fillStyle = dl.color || '#6b7280';
          if (dl.align === 'right') {
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(label, element.x + 6, element.y);
          } else if (dl.align === 'bottom') {
            // Below the point, so the YoY line's labels cannot collide with the bar/line
            // labels of the main dataset, which are drawn above.
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillText(label, element.x, element.y + 5);
          } else {
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.fillText(label, element.x, element.y - 4);
          }
          ctx.restore();
        });
      });
    }
  });
  Chart.register({
    id: 'supplyLagShade',
    beforeDraw: function(chart) {
      var pr = chart.data && chart.data._provRange;
      if (!pr) return;
      var xScale = chart.scales && chart.scales.x;
      var ca = chart.chartArea;
      if (!xScale || !ca) return;
      var bw = (xScale.getPixelForValue(1) - xScale.getPixelForValue(0)) || 20;
      var x0 = xScale.getPixelForValue(pr.start) - bw / 2;
      var x1 = xScale.getPixelForValue(pr.end) + bw / 2;
      var ctx = chart.ctx;
      ctx.save();
      ctx.fillStyle = 'rgba(180,180,180,0.13)';
      ctx.fillRect(x0, ca.top, x1 - x0, ca.bottom - ca.top);
      ctx.fillStyle = 'rgba(120,120,120,0.55)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('Not mature', (x0 + x1) / 2, ca.top + 4);
      ctx.restore();
    }
  });
}

// opts (all optional, added for compare grids — every existing 3-arg call is unchanged):
//   opts.compact      — small-multiple panel: no legend, no axis title, fewer x ticks.
//   opts.yRange       — force this y-range instead of the computed one.
//   opts.yoyRange     — same, for the right-hand YoY axis (compare grids share one scale).
//   opts.targetSeries — resolve the target line from this series instead of `s`;
//                       null suppresses the target line entirely.
// RETURNS the y-range this panel's own data implies (never opts.yRange), so a caller can
// union ranges across panels. Use trendRange() when you need that WITHOUT drawing.
function drawTrend(canvasId, cfg, s, opts) {
  opts = opts || {};
  if (cfg.multiLine) { drawMultiLineTrend(canvasId, cfg); return null; }
  if (cfg.mirrorBar) { drawMirrorChart(canvasId, cfg); return null; }
  var el = document.getElementById(canvasId); if (!el || !s || typeof Chart === 'undefined') return null;
  _ensureDatalabels();
  var D = trendCompute(cfg, s, opts.targetSeries);
  var buckets = D.buckets, lagN = D.lagN, win = D.win, labels = D.labels;
  var cur = D.cur, pyB = D.pyB, py = D.py, provCur = D.provCur;
  var pyYear = D.pyYear, tline = D.tline;
  var lastIdx = cur.reduce(function(li,v,i){ return v!=null?i:li; }, -1);
  var mainDs = { type:'bar', label:s.label, data:cur,
        backgroundColor:'rgba(250,79,45,0.75)', borderColor:'#FA4F2D',
        borderWidth:0, borderRadius:2, spanGaps:false,
        datalabels:{ display:true,
          color:'#6b7280', formatter:function(v){ return v!=null?fmtVal(v,s.fmt):''; } } };
  // Prior year is a LEVEL, so it is a column beside the actual, not a line (FPOPS-109).
  // No `datalabels` key at all — the supplyDatalabels plugin skips a dataset that has none, and two
  // labels per x-slot across 16 buckets is unreadable. Do NOT write datalabels:{display:false}:
  // test_compare_grid 8i checks the KEY is absent on every non-primary dataset, not its value.
  var pyDs = { type:'bar', label:'Prior year'+(pyYear?' ('+pyYear+')':''), data:py,
    backgroundColor:'rgba(156,163,175,0.55)', borderColor:'#9ca3af',
    borderWidth:0, borderRadius:2 };
  var ds = [mainDs, pyDs];
  if (provCur)
    ds.push({ type:'line', label:'Provisional (immature)', data:provCur, borderColor:'rgba(250,79,45,0.35)', borderWidth:1.5, borderDash:[3,4], pointRadius:0, tension:.25, fill:false, spanGaps:false });
  if (tline)
    ds.push({ type:'line', label:'Target', data:tline, borderColor:'#16a34a', borderWidth:2, borderDash:[6,3], pointRadius:0, stepped:true, fill:false, spanGaps:true });
  // Growth on its own right-hand axis. Straight segments (tension 0) — a smoothed growth
  // line implies intermediate values that do not exist between two buckets.
  if (D.yoy)
    ds.push({ type:'line', label:'YoY', data:D.yoy, yAxisID:'y1',
      borderColor:'#111827', backgroundColor:'#111827', borderWidth:2,
      pointRadius:3, pointBackgroundColor:'#111827', tension:0, fill:false, spanGaps:false,
      datalabels:{ display:true, align:'bottom', color:'#111827',
        formatter:function(v){ return v!=null ? yoyText(v, s.fmt) : ''; } } });
  // The YoY PLAN (GMV only — see bucketYoyTargetVal). Green dashed and stepped like the level target
  // it replaces: the sheet holds one rate per quarter, so smoothing it would imply intermediate
  // rates nobody planned.
  if (D.tyoy)
    ds.push({ type:'line', label:'YoY target', data:D.tyoy, yAxisID:'y1',
      borderColor:'#16a34a', borderWidth:2, borderDash:[6,3], pointRadius:0,
      stepped:true, fill:false, spanGaps:true });

  var _provRange = (lagN > 0 && _firstFut >= 0) ? { start:_firstFut, end:win.length-1 } : null;

                    (D.yoy || D.tyoy) ? { range: opts.yoyRange || D.yoyRange, fmt: s.fmt } : null);
  if (opts.compact) {
    // The axis title eats a third of a small panel and the panel heading already names
    // the unit. Value labels STAY: at ~450px (4-column grid) they fit, and they are what
    // makes a small multiple readable without hovering every point.
    o.scales.y.title.display = false;
    o.scales.x.ticks.maxTicksLimit = 7;
    if (o.scales.y1) { o.scales.y1.title.display = false; o.scales.y1.ticks.maxTicksLimit = 5; }
  }
  _charts[canvasId] = new Chart(el.getContext('2d'), { type:'bar', data:{ labels:labels, datasets:ds, _provRange:_provRange }, options:o });
