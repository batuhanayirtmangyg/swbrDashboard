}

// Everything drawTrend needs, computed without touching the DOM or building a Chart.
// Split out so a compare grid can learn every panel's y-range BEFORE drawing any of
// them, union the ranges, and then construct each chart once at the shared scale.
// Mutating chart.options.scales.y after construction moved the tick labels but not the
// plotted geometry, so a panel reading 47.7% was drawn against a 32-90% axis at the 70%
// mark. Passing the range at construction is the only reliable order.
//
// targetSeries: undefined -> resolve the target from `s` (every existing caller);
//               null      -> no target line at all;
//               a series  -> resolve the target from that instead (compare panels pass a
//                            member-tagged copy so each panel gets ITS OWN plan).
function trendCompute(cfg, s, targetSeries) {
  var buckets = bucketize(s, GRAN);
  var lagN = cfg.lagWeeks || 0;
  var win = buildWindow(GRAN, laggedWeek(cfg, 1), AHEAD[GRAN]);
  var labels = win.map(function (b) { return b.label; });
  var cur = win.map(function (b) { return b.future ? null : (buckets[b.key] != null ? buckets[b.key] : null); });
  var pyB = pyBuckets(s, GRAN);
  var py  = win.map(function (b) { var v = pyB[b.key]; return v != null ? v : null; });
  var lastCur = win.filter(function (b) { return !b.future; }).slice(-1)[0];
  var pyYear = lastCur ? (bucketStart(lastCur.key, GRAN).getUTCFullYear() - 1) : '';
  // FPOPS-78: provisional dataset = first lagN future buckets (immature weeks before today)
  var provCur = null;
  if (lagN > 0) {
    var _fi = 0;
    var _provData = win.map(function(b) {
      if (!b.future) return null;
      return (_fi++ < lagN) ? (buckets[b.key] != null ? buckets[b.key] : null) : null;
    });
    if (_provData.some(function(v){ return v != null; })) provCur = _provData;
  }
  // FPOPS-109: ONE encoding rule across the dashboard — columns are a LEVEL, lines are GROWTH.
  // This used to be `s.kind === 'sum'`, so a rate drew its actual as a line and its prior year as a
  // second line, and a reader had to know which line was which before reading the chart.
  // The cost, taken deliberately: a bar must anchor at 0 (see `range` below). Two bars per x-slot
  // truncated at, say, 68% would exaggerate the gap between them — the classic misleading-bar
  // problem, and worse with a pair than with one. So uptime at 71.9% vs 77.7% renders as two nearly
  // equal bars, and what carries the movement is the per-bar value label plus the YoY line on y1.
  var isBar = true;

  // YoY per bucket, index-aligned to `cur`. Unit-aware via yoyRaw: an absolute grows by %,
  // a rate moves by pp — the SAME rule the detail table applies, so chart and table agree.
  // Provisional buckets are deliberately EXCLUDED: an immature actual against a full
  // prior-year bucket is the comparison qtdCmp exists to prevent, and this line carries no
  // dashed treatment to signal it.
  var yoy = cur.map(function (v, i) { return yoyRaw(v, py[i], s.fmt); });
  if (!yoy.some(function (v) { return v != null; })) yoy = null;

  // Target step line: total-level only. Suppressed once a dimension cut is applied
  // (the total-plan target no longer compares to a sliced actual).
  //
  // A metric plans EITHER a growth rate OR a level, never both, so exactly one of these is non-null.
  // A growth-mode plan (GMV) IS a YoY rate, so it belongs on the growth axis beside the actual YoY
  // line — drawn as a level line on the left it was a €M figure competing with the bars for the same
  // axis while saying nothing about the rate that was actually planned. Every other metric plans a
  // level and gets the pre-existing tline path bit-identically, since bucketYoyTargetVal returns
  // null at every bucket for a non-growth map.
  var tsel = (targetSeries === undefined) ? s : targetSeries;
  var tline = null, tyoy = null;
  if (cfg.target && targetsValid() && tsel) {
    tyoy = win.map(function (b) { return bucketYoyTargetVal(cfg, tsel, b.date); });
    if (!tyoy.some(function (v) { return v != null; })) tyoy = null;
    if (!tyoy) {
      // pyB[b.key] is the growth base: passing null here meant targetInfo returned null for every
      // growth metric, so the GMV charts showed no target line at any granularity.
      tline = win.map(function (b) { return bucketTargetVal(cfg, tsel, b.date, GRAN, pyB[b.key]); });
      if (!tline.some(function (v) { return v != null; })) tline = null;
    }
  }

  // Y-axis: base on current data; extend to include PY only when PY doesn't dominate (≤3× curSpan away)
  var _curVals = cur.concat(provCur || []).filter(function(v){ return v != null; });
  var allVals = _curVals.slice();
  if (_curVals.length) {
    var _curMin = Math.min.apply(null, _curVals), _curMax = Math.max.apply(null, _curVals);
    var _curSpan = Math.max(_curMax - _curMin, Math.abs(_curMax) * 0.05 || 1);
    var _pyVals = py.filter(function(v){ return v != null; });
    if (_pyVals.length) {
      var _pyMin = Math.min.apply(null, _pyVals), _pyMax = Math.max.apply(null, _pyVals);
      if (_curMin - _pyMin < 3 * _curSpan && _pyMax - _curMax < 3 * _curSpan) {
        allVals = allVals.concat(_pyVals);
      }
    }
  }
  // Fold the target in — it is a drawn dataset, and a plan above the actual's range was
  // silently clipped off-canvas. Same 3×-span guard as PY so a wild plan cannot flatten
  // the actual into a straight line.
  if (tline && _curVals.length) {
    var _tv = tline.filter(function (v) { return v != null; });
    if (_tv.length) {
      var _cMin = Math.min.apply(null, _curVals), _cMax = Math.max.apply(null, _curVals);
      var _cSpan = Math.max(_cMax - _cMin, Math.abs(_cMax) * 0.05 || 1);
      var _tMin = Math.min.apply(null, _tv), _tMax = Math.max.apply(null, _tv);
      if (_cMin - _tMin < 3 * _cSpan && _tMax - _cMax < 3 * _cSpan) allVals = allVals.concat(_tv);
    }
  }
  var range = null;
  if (allVals.length) {
    var dMin = Math.min.apply(null, allVals), dMax = Math.max.apply(null, allVals);
    var minPad = s.fmt === 'pct' ? 1 : s.fmt === 'days' ? 0.5 : s.fmt === 'eurM' || s.fmt === 'eur' ? 0.5 : 10;
    var pad = Math.max((dMax - dMin) * 0.15, minPad);
    // Bars anchor at 0, always — a truncated column lies about the proportion between the actual
    // and the prior-year column standing next to it. See the isBar note above.
    range = { min:0, max:dMax+pad };
  }

  // The YoY axis is its OWN scale — a growth % shares no units with a €M bar, so it is
  // computed independently of `range` and never folded into it. 0 is always inside the
  // range: the zero-growth line is what makes the sign readable at a glance.
  // The YoY TARGET is folded in for the same reason tline is folded into `range` above: a drawn
  // dataset outside its axis range is silently clipped off-canvas. And the range is built whenever
  // EITHER exists — a series with no prior year has no actual YoY but can still have a plan rate,
  // and gating on `yoy` alone would put that line on an undefined y1 scale.
  var yoyRange = null;
  if (yoy || tyoy) {
    var _yv = (yoy || []).concat(tyoy || []).filter(function (v) { return v != null; });
    var yMin = Math.min.apply(null, _yv.concat([0])), yMax = Math.max.apply(null, _yv.concat([0]));
    var yPad = Math.max((yMax - yMin) * 0.15, 1);
    yoyRange = { min: yMin - yPad, max: yMax + yPad };
  }
  return { buckets:buckets, lagN:lagN, win:win, labels:labels, cur:cur, pyB:pyB, py:py,
           provCur:provCur, isBar:isBar, pyYear:pyYear, tline:tline, tyoy:tyoy, range:range,
           yoy:yoy, yoyRange:yoyRange };
}

// The y-range a panel would use, without drawing it.
function trendRange(cfg, s, targetSeries) { return trendCompute(cfg, s, targetSeries).range; }
function drawMultiLineTrend(canvasId, cfg) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') return;
  _ensureDatalabels();
  var m = computeMetric(cfg);
  var seriesList = m.series.filter(function(s){ return !s.isDim; });
  if (!seriesList.length) return;
  var lagN = cfg.lagWeeks || 0;
  var win = buildWindow(GRAN, laggedWeek(cfg, 1), AHEAD[GRAN]);
  var labels = win.map(function(b){ return b.label; });
  var LINE_COLORS = ['#FA4F2D', '#3b82f6', '#10b981'];
  var allCur = [];
  var ds = seriesList.map(function(s, si) {
    var c = LINE_COLORS[si % LINE_COLORS.length];
    var buckets = bucketize(s, GRAN);
    var cur = win.map(function(b){ return b.future ? null : (buckets[b.key] != null ? buckets[b.key] : null); });
    allCur = allCur.concat(cur.filter(function(v){ return v != null; }));
    var sfmt = s.fmt;
    var provData = null;
    if (lagN > 0) {
      var _fi = 0;
      var _prov = win.map(function(b){
        if (!b.future) return null;
        return (_fi++ < lagN) ? (buckets[b.key] != null ? buckets[b.key] : null) : null;
      });
      if (_prov.some(function(v){ return v != null; })) provData = _prov;
    }
    var result = [{ label:s.label, data:cur, borderColor:c, backgroundColor:'transparent',
      borderWidth:2, pointRadius:2, pointBackgroundColor:c, tension:.25, fill:false, spanGaps:false,
      datalabels:{ display:true, color:c, formatter:function(v){ return v!=null?fmtVal(v,sfmt):''; } } }];
    if (provData) result.push({ type:'line', label:s.label + ' (prov)', data:provData,
      borderColor:c + '60',
      borderWidth:1.5, borderDash:[3,4], pointRadius:0, tension:.25, fill:false, spanGaps:false });
    return result;
  });
  var flatDs = [].concat.apply([], ds);
  var _firstFut = win.findIndex(function(b){ return b.future; });
  var _provRange = (lagN > 0 && _firstFut >= 0) ? { start:_firstFut, end:win.length-1 } : null;
  var yRange = null;
  if (allCur.length) {
    var dMin = Math.min.apply(null, allCur), dMax = Math.max.apply(null, allCur);
    var pad = Math.max((dMax - dMin) * 0.15, cfg.fmt === 'days' ? 0.5 : 1);
    yRange = { min: Math.max(0, dMin - pad), max: dMax + pad };
  }
  _charts[canvasId] = new Chart(el.getContext('2d'), {
    type:'line', data:{ labels:labels, datasets:flatDs, _provRange:_provRange },
    options: chartOpts(cfg.fmt, true, yRange)
  });
}

function drawMirrorChart(canvasId, cfg) {
  var el = document.getElementById(canvasId); if (!el || typeof Chart === 'undefined') return;
  _ensureDatalabels();
  var m = computeMetric(cfg);
  var posS = m.series.filter(function(s){ return s.key === cfg.primary; })[0];
  var negS = m.series.filter(function(s){ return s.key !== cfg.primary && !s.isDim; })[0];
  if (!posS && !negS) return;
  var win = buildWindow(GRAN, laggedWeek(cfg, 1), AHEAD[GRAN]);
  var labels = win.map(function(b){ return b.label; });
  var posB = posS ? bucketize(posS, GRAN) : {};
  var negB = negS ? bucketize(negS, GRAN) : {};
  var posVals = win.map(function(b){ return b.future || posB[b.key] == null ? null : posB[b.key]; });
  var negVals = win.map(function(b){ return b.future || negB[b.key] == null ? null : -negB[b.key]; });
  var netVals = win.map(function(b){ var p = posB[b.key], n = negB[b.key]; return b.future ? null : ((p != null || n != null) ? (p||0)-(n||0) : null); });
  var allAbs = posVals.concat(negVals).filter(function(v){ return v != null; }).map(Math.abs);
  var maxAbs = allAbs.length ? Math.max.apply(null, allAbs) : 1;
  var pad = Math.max(maxAbs * 0.12, 10);
  var yRange = { min: -(maxAbs + pad), max: maxAbs + pad };
  var ds = [];
  if (posS) ds.push({ type:'bar', label:posS.label, data:posVals, backgroundColor:'rgba(250,79,45,0.75)', borderColor:'#FA4F2D', borderWidth:0, borderRadius:2, spanGaps:false, datalabels:{ display:false } });
  if (negS) ds.push({ type:'bar', label:negS.label, data:negVals, backgroundColor:'rgba(15,118,110,0.75)', borderColor:'#0f766e', borderWidth:0, borderRadius:2, spanGaps:false, datalabels:{ display:false } });
  ds.push({ type:'line', label:'Net', data:netVals, borderColor:'#9ca3af', borderWidth:2, pointRadius:0, tension:.25, fill:false, spanGaps:true });
  var opts = chartOpts(cfg.fmt, true, yRange);
  if (opts.scales && opts.scales.x) opts.scales.x.grouped = false;
  _charts[canvasId] = new Chart(el.getContext('2d'), {
    type:'bar', data:{ labels:labels, datasets:ds },
    options: opts
  });
}

function drawSpark(canvasId, s, cfg) {
  var el = document.getElementById(canvasId); if (!el || !s || typeof Chart === 'undefined') return;
  var buckets = bucketize(s, GRAN), win = buildWindow(GRAN, laggedWeek(cfg, 1));
  var cur = win.map(function(b){ return b.future ? null : (buckets[b.key] != null ? buckets[b.key] : null); });
  var pyB = pyBuckets(s, GRAN);
  var py  = win.map(function(b){ var v = pyB[b.key]; return v != null ? v : null; });
  // Hollow last data point = provisional/WTD indicator (weekly only)
  var lastIdx = cur.reduce(function(li,v,i){ return v!=null?i:li; }, -1);
  var ptRadius = cur.map(function(_,i){ return (i === lastIdx && GRAN === 'week') ? 3 : 0; });
  var ptBgColor = cur.map(function(_,i){ return (i === lastIdx && GRAN === 'week') ? 'white' : '#FA4F2D'; });
  var allVals = cur.filter(function(v){ return v != null; });
  var sparkY = {};
  if (allVals.length) {
    var sMin = Math.min.apply(null, allVals), sMax = Math.max.apply(null, allVals);
    var sPad = Math.max((sMax - sMin) * 0.2, 1);
    sparkY = { min: Math.max(0, sMin - sPad), max: sMax + sPad };
  }
  _charts[canvasId] = new Chart(el.getContext('2d'), {
    type:'line',
    data:{ labels:win.map(function(b){ return b.label; }), datasets:[
      { data:cur, borderColor:'#FA4F2D', borderWidth:2, pointRadius:ptRadius,
        pointBackgroundColor:ptBgColor, pointBorderColor:'#FA4F2D',
        tension:.3, fill:false, spanGaps:false },
      { data:py, borderColor:'#d1d5db', borderWidth:1.5, borderDash:[4,3],
        pointRadius:0, tension:.3, fill:false, spanGaps:true }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{enabled:false} },
      scales:{ x:{display:false}, y:Object.assign({display:false}, sparkY) } }
  });
}
// y1 (optional, {range, fmt}) adds the right-hand YoY axis. Absent for every pre-existing
// caller — drawMultiLineTrend and drawMirrorChart pass 3 args and get exactly what they did
// before. Datasets with no yAxisID default to the scale named `y`, which is always defined.
function chartOpts(fmt, legend, yRange, y1) {
  var yScale = { ticks:{ font:{size:10}, color:'#9ca3af', callback:function (v) { return fmtVal(v, fmt); } }, grid:{ color:'#eee' },
                 title:{ display:!!UNIT[fmt], text:UNIT[fmt] || '', color:'#9ca3af', font:{size:10} } };
  if (yRange) { yScale.min = yRange.min; yScale.max = yRange.max; }
  var scales = { x:{ ticks:{ maxTicksLimit:14, font:{size:10}, color:'#9ca3af' }, grid:{ display:false } }, y: yScale };
  if (y1) {
    var y1fmt = y1.fmt;
    scales.y1 = { position:'right',
      // No second set of horizontal gridlines — two grids at different scales read as noise.
      grid:{ drawOnChartArea:false },
      ticks:{ font:{size:10}, color:'#9ca3af', callback:function (v) { return yoyText(v, y1fmt); } },
      title:{ display:true, text: (y1fmt === 'pct' || y1fmt === 'days') ? 'YoY Δ' : 'YoY %', color:'#9ca3af', font:{size:10} } };
    if (y1.range) { scales.y1.min = y1.range.min; scales.y1.max = y1.range.max; }
  }
  return { responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ display:!!legend, position:'top', align:'end', labels:{ boxWidth:12, font:{size:11} } },
      // Branch on the axis: a +8% growth point formatted with the metric's own fmt would
      // read as "€0.0M" in the tooltip.
      tooltip:{ callbacks:{ label:function (c) {
        return c.dataset.label + ': ' + (c.dataset.yAxisID === 'y1' ? yoyText(c.parsed.y, fmt) : fmtVal(c.parsed.y, fmt));
      } } } },
    scales: scales };
}

// ── Compare cuts — small multiples ────────────────────────────────────────────
// One engine, two entry points: the ⊞ on a metric tile and the Compare tab. Both call
// compareGridHtml() to build the panels and cmpDraw() to fill them.
//
// Cost model: each cut is one getSeries RPC against a gzipped Drive artifact (~1s for
// most metrics, ~9s for gmv_yoy), queued 6 at a time by _pump and cached 6h server-side,
// so a repeat view is free. There is deliberately no cap on the number of cuts — the
// meter shows the real cost instead, because a hard limit blocks a legitimate
// "all 26 offices" view while a slow load is merely slow.

function cmpEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Measured/projected artifact gunzip+parse seconds (DATABRICKS_side_spec.md §3f).
// Function-local: a module-scope var reads undefined under the vm-sandbox harnesses.
function cmpFetchSecs(metricKey) {
  var T = { gmv_yoy:9, no_show_rate:7.3, gwc_nr:7, reseller_rate:7,
            supplier_cancellation:6.3, atc_error_rate:2.5, sellout:1.3 };
  return T[metricKey] || 1;
}

// One real dimension, two column names. `1b30d_by_channel` declares dim.col:'channel'
// on purpose — the artifact's own name — while FILTER_COLS and the filter bar call the
// same thing 'tour_acquisition_channel' (Code.gs:823 does the identical fallback server
// side). Comparing the raw strings made a channel cut miss the metric's own dim block,
// which cost N RPCs for data already in hand AND silently killed every per-channel
// target, because cmpTargetSeries gates on cmpIsFreeDim.
function cmpCanonCol(col) { return col === 'channel' ? 'tour_acquisition_channel' : col; }

// A metric whose own dim block matches the requested column already carries every
// member as an isDim series inside the SINGLE unfiltered fetch. That cut costs nothing.
function cmpIsFreeDim(cfg, dimCol) {
  return !!(cfg && cfg.dim && cmpCanonCol(cfg.dim.col) === cmpCanonCol(dimCol));
}

// Dimensions this metric can be cut by, as [{col,label}]. Mirrors populateFilters:
// source_corridor only exists on demand/overflow/gmv sheets, and a noDims metric has
// no dimension columns at all.
function cmpDimOptions(cfg) {
  if (!cfg || cfg.noDims) return [];
  return FILTERS.filter(function (f) {
    if (f.demandOnly && cfg.stage !== 'commercial' && cfg.stage !== 'performance') return false;
    return cmpIsFreeDim(cfg, f.col) || (collectDimValuesFor(cfg, f.col) || []).length > 1;
  }).map(function (f) { return { col: f.col, label: f.label }; });
}

// Domain values for one metric x column, independent of which view is current.
// collectDimValues() is view-scoped (it unions across the visible tab), which is right
// for the global filter bar and wrong here — a compare grid asks about one metric.
function collectDimValuesFor(cfg, col) {
  if (!cfg) return [];
  if (cmpIsFreeDim(cfg, col)) {
    return (computeMetric(cfg).series || [])
      .filter(function (s) { return s.isDim && s.member; })
      .map(function (s) { return s.member; });
  }
  var per = DOMAINS_BY_KEY[cfg.key] && DOMAINS_BY_KEY[cfg.key][col];
  var src = per || DOMAINS[col] || {};
  return Object.keys(src).sort();
}

// The series a panel should show. For a free dim that is the member's own isDim series;
// otherwise it is the chosen series inside the filtered result for that member.
function cmpPanelSeries(cfg, dimCol, member, seriesKey) {
  if (cmpIsFreeDim(cfg, dimCol)) {
    return (computeMetric(cfg).series || [])
      .filter(function (s) { return s.isDim && s.member === member; })[0] || null;
  }
  var cached = SERIES_CACHE[cfg.key + '|' + cmpSigFor(dimCol, member)];
  if (!cached || !cached.length) return null;
  var pick = cached.filter(function (s) { return !s.isDim && s.key === seriesKey; })[0];
  return pick || cached.filter(function (s) { return !s.isDim; })[0] || null;
}

// The series to resolve a panel's TARGET from, or null for "this cut has no plan".
//
// Two bugs this closes. (1) A fetched cut returns a NON-dim series, so rawTarget matched
// the static TARGET_MAP['<key>.total'] entry and every panel drew the **Total plan against
// a sliced actual** — exactly what targetsValid() exists to prevent, slipped past because
// the cut lives in the fetch signature and never in currentFilters. (2) rawTarget's
// `|| byName[tnorm('Total')]` fallback does the same for any member with no plan row.
// In a grid, silently charging a slice against the total plan is the bug, not a graceful
// default, so this presence-checks the channel and returns null rather than falling back.
function cmpTargetSeries(cfg, dimCol, member, s) {
  if (!cfg || !cfg.target || !s) return null;
  // The target sheet's only member dimension is Channel, and only these two metrics carry
  // per-channel rows. A cut by geo / category / office therefore cannot have its own plan.
  // Function-local: a module-scope var reads undefined under the vm-sandbox harnesses.
  var CH_TARGET = { tours_by_channel: 'Acquisitions', '1b30d_by_channel': '1b30d' };
  var name = CH_TARGET[cfg.key];
  if (!name || !cmpIsFreeDim(cfg, dimCol)) return null;   // free-dim == cut on the channel column
  var T = BOOT && BOOT.targets; if (!T) return null;
  var byName = T[tnorm(name)]; if (!byName) return null;
  if (byName[_chKey(byName, member)] == null) return null;
  // The key must NOT collide with a static TARGET_MAP entry, or rawTarget takes that
  // branch (channel 'Total') before it ever reaches the dim-member override.
  return Object.assign({}, s, { key: 'dim__' + member, isDim: true, member: member });
}

// Merge the cut into the active global filters, then build the canonical signature.
// Respecting the global filters matters: the free-dim path reads computeMetric(), which
// is already globally filtered, so a fetched cut that ignored them would silently
// disagree with a free one on the same screen.
function cmpFmapFor(dimCol, member) {
  var fmap = filtersMap();
  fmap[dimCol] = [member];
  return fmap;
}
function cmpSigFor(dimCol, member) { return sigOf(cmpFmapFor(dimCol, member)); }

// How many cuts still need fetching, and roughly how long that will take.
// ceil(n/6) because _pump runs 6 RPCs at a time; already-cached cuts count as free.
function cmpCost(cfg, dimCol, members) {
  if (!cfg || cmpIsFreeDim(cfg, dimCol)) return { n: 0, secs: 0 };
  var n = (members || []).filter(function (m) {
    return !SERIES_CACHE[cfg.key + '|' + cmpSigFor(dimCol, m)];
  }).length;
  return { n: n, secs: Math.ceil(n / 6) * cmpFetchSecs(cfg.key) };
}

// True when this metric cannot answer this cut because its artifact is exported as
// single-dimension marginals. Two layers: the registry flag is known up front so the
// UI can grey out before spending an RPC, and the server's own reason (Code.gs
// _aggMarginals -> _seriesNote) is the backstop if an artifact's layout changes.
function cmpBlockedReason(cfg, dimCol) {
  if (!cfg) return null;
  var globalCols = Object.keys(filtersMap()).filter(function (c) { return c !== dimCol; });
  if (cfg.marginals && globalCols.length) {
    return cfg.label + ' can only be cut by one dimension at a time, and a global filter ' +
           'is already applied. Clear the filter to compare by ' + dimCol + '.';
  }
  return _seriesNote(cfg.key + '|' + cmpSigFor(dimCol, (collectDimValuesFor(cfg, dimCol) || [])[0]));
}

// Build the grid. Returns HTML only — the caller writes it into the DOM and then calls
// cmpDraw(), same build-then-draw order every other renderer here uses.
function compareGridHtml(cfg, dimCol, members, gridId, seriesKey) {
  var blocked = cmpBlockedReason(cfg, dimCol);
  if (blocked) {
    return '<div id="' + gridId + '" class="msg" style="padding:14px;color:#b45309;background:#fffbeb;' +
      'border:1px solid #fde68a;border-radius:6px;font-size:13px">⚠ ' + cmpEsc(blocked) + '</div>';
  }
  if (!members || !members.length) {
    return '<div id="' + gridId + '" class="msg" style="padding:10px 4px;color:#9ca3af;font-size:13px">' +
      'No values to compare for this dimension.</div>';
  }
  var cost = cmpCost(cfg, dimCol, members);
  var note = cost.n
    ? '<div class="cmp-note" style="font-size:11px;color:#9ca3af;margin:0 0 8px">' +
      'Loading ' + cost.n + ' cut' + (cost.n === 1 ? '' : 's') + ' — about ' +
      (cost.secs < 1 ? '1' : Math.round(cost.secs)) + 's' +
      (cost.secs >= 10 ? ' (this metric is slow to fetch)' : '') + '</div>'
    : '';
  var panels = members.map(function (mem, i) {
    return '<div class="cmp-panel">' +
      '<div class="cmp-panel-title" title="' + cmpEsc(mem) + '">' + cmpEsc(mem) + '</div>' +
      '<div class="cmp-canvas-box"><canvas id="' + gridId + '-c' + i + '"></canvas></div>' +
      '<div class="cmp-panel-msg" id="' + gridId + '-m' + i + '"><span class="spinner"></span>Loading…</div>' +
      '</div>';
  }).join('');
  return note + '<div class="cmp-grid" id="' + gridId + '">' + panels + '</div>';
}

// Fetch whatever is missing and draw each panel as it lands. Safe to call repeatedly:
// _fetchSeries dedupes in flight, and a panel already drawn is simply redrawn.
function cmpDraw(cfg, dimCol, members, gridId, seriesKey) {
  if (!cfg || !members || !members.length) return;
  if (!document.getElementById(gridId)) return;      // grid was re-rendered away
  if (cmpBlockedReason(cfg, dimCol)) return;

  function paint() {
    if (!document.getElementById(gridId)) return;

    // PASS 1 — resolve every panel and learn its y-range WITHOUT drawing anything.
    // Panels on independent auto-scales are not comparable, which is the whole point of a
    // small-multiples grid; and the range has to be known before construction, because
    // mutating chart.options.scales.y afterwards moves the tick labels without reliably
    // moving the plotted geometry.
    var panels = members.map(function (mem, i) {
      var s = cmpPanelSeries(cfg, dimCol, mem, seriesKey);
      if (!s) return { mem: mem, i: i, s: null };
      var tgt = cmpTargetSeries(cfg, dimCol, mem, s);
      // One trendCompute per panel, not one per axis — both ranges come out of the same object.
      var D = trendCompute(cfg, s, tgt);
      return { mem: mem, i: i, s: s, tgt: tgt, range: D.range, yoyRange: D.yoyRange };
    });
    function _union(key) {
      var rs = panels.map(function (p) { return p[key]; }).filter(Boolean);
      return rs.length > 1
        ? { min: Math.min.apply(null, rs.map(function (r) { return r.min; })),
            max: Math.max.apply(null, rs.map(function (r) { return r.max; })) }
        : null;
    }
    var shared = _union('range');
    // The YoY axis needs the same treatment for the same reason — panels whose growth lines
    // sit on independent scales cannot be read against each other.
    var sharedYoy = _union('yoyRange');

    // PASS 2 — construct each chart once, at the shared scale.
    panels.forEach(function (p) {
      var cid = gridId + '-c' + p.i, msg = document.getElementById(gridId + '-m' + p.i);
      if (!document.getElementById(cid)) return;
      if (!p.s) {
        // Absent cache key = still in flight; an empty array = fetched and had nothing.
        var sig = cmpSigFor(dimCol, p.mem);
        var pending = SERVER_MODE && !cmpIsFreeDim(cfg, dimCol) && !SERIES_CACHE[cfg.key + '|' + sig];
        var why = _seriesNote(cfg.key + '|' + sig);
        if (msg) msg.innerHTML = pending ? '<span class="spinner"></span>Loading…'
                               : why ? '⚠ ' + cmpEsc(why) : 'No data';
        return;
      }
      // An absent target must read as known, not broken: this metric is planned, but not
      // for this cut. Saying nothing looks identical to a rendering failure.
      if (msg) msg.innerHTML = (cfg.target && !p.tgt)
        ? '<span style="opacity:.75">no plan for this cut</span>' : '';
      if (_charts[cid]) { _charts[cid].destroy(); delete _charts[cid]; }
      drawTrend(cid, cfg, p.s, { compact: true, yRange: shared, yoyRange: sharedYoy, targetSeries: p.tgt });
    });
  }

  paint();
  if (cmpIsFreeDim(cfg, dimCol)) return;             // every member came free — nothing to fetch

  if (!SERVER_MODE) {                                 // local preview: aggregate in-browser
    members.forEach(function (mem) {
      var sig = cmpSigFor(dimCol, mem);
      if (SERIES_CACHE[cfg.key + '|' + sig]) return;
      var res = localAggregate(cfg, cmpFmapFor(dimCol, mem));
      SERIES_CACHE[cfg.key + '|' + sig] = enrichSeries(cfg, res.series);
      noteDomains(res.domains, cfg.key);
    });
    paint();
    return;
  }
  // Route through _fetchSeries, never a bare google.script.run: that is what inherits the
  // 6-way queue and the in-flight dedupe. prefetchFiltered bypasses both, which is why the
  // GMV breakdown tables can already put 14 RPCs on the wire at once.
  members.forEach(function (mem) {
    _fetchSeries(cfg, cmpSigFor(dimCol, mem), cmpFmapFor(dimCol, mem), function () { cmpPaintSoon(gridId, paint); });
  });
}

// Per-grid repaint coalescer. Deliberately NOT _paintSoon: that is a single global slot
// owned by render(), so a grid and a page repaint racing through it would drop one of
// them — the same single-slot hazard as window.afterDashboardRender.
function cmpPaintSoon(gridId, paint) {
  var h = cmpPaintSoon; if (!h._t) h._t = {};
  h[gridId] = paint;
  if (h._t[gridId]) return;
  h._t[gridId] = setTimeout(function () {
    delete h._t[gridId];
    var p = h[gridId]; delete h[gridId];
    if (p) p();
  }, 300);
}

// ── Glossary (FPOPS-55) ────────────────────────────────────────────────────
function renderGlossary() {
  var STAGE_ORDER = ['curation', 'acquisition', 'commercial', 'performance'];
  var byStage = {};
  METRIC_REGISTRY.filter(function(m){ return !m.hidden; }).forEach(function(m){
    (byStage[m.stage] = byStage[m.stage] || []).push(m);
  });
  var rows = STAGE_ORDER.filter(function(s){ return byStage[s]; }).map(function(s) {
    var hdr = '<tr><td colspan="5" style="padding:10px 12px 4px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#6b7280;background:#f9fafb;border-top:2px solid #e5e7eb;text-align:left">' + (STAGE_LABEL[s] || s) + '</td></tr>';
    return hdr + byStage[s].map(function(m) {
      var dimNote = m.dim ? 'By ' + m.dim.col.replace(/_/g,' ') : (m.noDims ? 'Not sliceable' : 'All global filters');
      return '<tr style="border-bottom:1px solid #f0f0f2">' +
        '<td style="padding:8px 12px;font-weight:700;white-space:nowrap;text-align:left">' + m.label + '</td>' +
        '<td style="padding:8px 12px;text-align:left">' + (m.desc || '—') + '</td>' +
        '<td style="padding:8px 12px;font-size:12px;color:#6b7280;white-space:nowrap;text-align:left">' + dimNote + '</td>' +
        '<td style="padding:8px 12px;font-size:12px;text-align:left">' + (m.bizOwner || '—') + '</td>' +
        '<td style="padding:8px 12px;font-size:12px;color:#6b7280;text-align:left">' + (m.fpaOwner || '—') + '</td></tr>';
    }).join('');
  }).join('');
  document.getElementById('glossary-body').innerHTML = rows;
  document.getElementById('glossary-overlay').style.display = 'flex';
}
window.closeGlossary = function(){ document.getElementById('glossary-overlay').style.display = 'none'; };

// L12W is a FIXED rolling 12 calendar weeks at every granularity — it deliberately does not
// become L12M/L12Q when the granularity changes. History only goes back ~24 months, so a
// 12-quarter window cannot be computed at all, and a 12-month one would not be comparable to
// the weekly view. Reported as a bug (FPOPS-81) because the label sits next to a chart that DOES
// re-bucket, so the footnote states the intent rather than the maths changing.
var L12W_NOTE = 'L12W is always the last 12 calendar weeks, at every granularity. Data history covers ~24 months, so a 12-quarter (L12Q) window is not computable; the 12-week window is kept as the one consistent rolling comparison.';
function footnote(txt) {
  return '<p style="font-size:11px;color:var(--dark-2);margin:6px 20px 0;opacity:.7">' + txt + '</p>';
}

// ── Shareable tile links ─────────────────────────────────────────────────────
// A tile is identified by its data-comment-target key (section:… / kpi:… / metric:…), which the
// comment system already re-emits on every render — no second key scheme. The link additionally
// pins the five globals that ARE the view, so a link pasted into a doc still resolves to the same
// numbers months later.

// The view state, as flat string params. Pure — safe to call any time.
function shareState() {
  return {
    view: currentView || '',
    gran: GRAN || '',
    week: selectedWeek || '',
    f: JSON.stringify(currentFilters || {}),
    s: JSON.stringify(_blockSeries || {}),
    // Compare state. Rides the same single JSON blob as everything else, so index.html
    // still needs no edit — that is why the params travel here rather than as new
    // template variables. `c` covers the Compare tab, `o` the per-tile ⊞ toggles.
    c: JSON.stringify(cmpState() || {}),
    o: JSON.stringify(_cmpOpen || {}),
    // Per-region breakdown cut, so a shared RD table lands on the cut it was shared with.
    r: JSON.stringify(regionState() || {})
  };
}

// Inverse of shareState(). Tolerates missing/garbage fields — '?t=metric:gmv_yoy' alone is a valid
// link, and a hand-edited URL must not take the dashboard down.
function applyShareState(d) {
  d = d || {};
  if (d.view && VIEWS[d.view]) currentView = d.view;
  if (d.gran && WINDOW[d.gran] !== undefined) {
    GRAN = d.gran;
    // Not setGranularity(): that calls render(), and this runs before the first one.
    ['week', 'month', 'quarter', 'year'].forEach(function (x) {
      var b = document.getElementById('gran-' + x); if (b) b.classList.toggle('active', x === GRAN);
    });
  }
  if (d.week) selectedWeek = d.week;
  if (d.f) {
    try {
      var f = JSON.parse(d.f);
      FILTERS.forEach(function (x) {                     // only known keys; unknown ones dropped
        if (Object.prototype.hasOwnProperty.call(f, x.key)) {
          currentFilters[x.key] = Array.isArray(f[x.key]) ? f[x.key] : [];
        }
      });
    } catch (e) {}
  }
  if (d.s) { try { var s = JSON.parse(d.s); if (s && typeof s === 'object') _blockSeries = s; } catch (e2) {} }
  if (d.c) {
    try {
      var c = JSON.parse(d.c);
      // Only adopt a metric that still exists — a link outliving a registry change must
      // fall back to the default, not blank the tab.
      if (c && typeof c === 'object' && c.metric && REG_BY_KEY[c.metric]) {
        var cs = cmpState();
        cs.metric  = c.metric;
        cs.dim     = c.dim || null;
        cs.members = Array.isArray(c.members) ? c.members : null;
        cs.series  = c.series || null;
      }
    } catch (e3) {}
  }
  if (d.o) {
    try {
      var o = JSON.parse(d.o);
      if (o && typeof o === 'object') {
        Object.keys(o).forEach(function (k) { if (REG_BY_KEY[k] && o[k]) _cmpOpen[k] = o[k]; });
      }
    } catch (e4) {}
  }
  if (d.r) {
    try {
      var r = JSON.parse(d.r), rs = regionState();
      // Only known regions and known cut columns — a link outliving a registry change must fall
      // back to the default cut, not blank the table.
      if (r && typeof r === 'object') {
        var cols = regionCutOptions().map(function (f) { return f.col; });
        regionList().forEach(function (k) { if (cols.indexOf(r[k]) >= 0) rs[k] = r[k]; });
      }
    } catch (e5) {}
  }
}

// Full link for one tile. SHARE_URL may still be empty right after paint (getAdminState is async),
// in which case the dialog shows the bare query string plus a note rather than a broken link.
function shareUrl(target) {
  var st = shareState(), q = ['t=' + encodeURIComponent(target)];
  Object.keys(st).forEach(function (k) { if (st[k]) q.push(k + '=' + encodeURIComponent(st[k])); });
  return (SHARE_URL || '') + '?' + q.join('&');
}

// The 🔗 button emitted inside every tile header. stop=true adds stopPropagation for headers that
// carry their own onclick (section headers toggle collapse).
function shareBtn(target, stop) {
  return '<button class="share-btn" title="Copy a link to this tile" onclick="' +
    (stop ? 'event.stopPropagation();' : '') + 'copyShareLink(\'' + target.replace(/'/g, "\\'") + '\')"' +
    ' style="background:none;border:none;cursor:pointer;opacity:.45;font-size:13px;padding:0 4px;line-height:1"' +
    '>&#128279;</button>';
}

// Dialog is built here, not in index.html: index.html and javascript.html are pasted into the Apps
// Script editor separately, so markup in one file and its reader in the other is the silent-deploy
// bug class that cost a morning on #btn-analytics. Clipboard write can be refused inside the
// sandboxed googleusercontent.com iframe, so the input is always shown and pre-selected — the
// dialog never depends on the clipboard API succeeding.
function copyShareLink(target) {
  var url = shareUrl(target);
  var old = document.getElementById('share-overlay'); if (old) old.remove();
  var ov = document.createElement('div');
  ov.id = 'share-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center';
  ov.onclick = function (e) { if (e.target === ov) ov.remove(); };

  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:10px;padding:18px 20px;width:min(560px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.25);font-size:13px';
  box.innerHTML = '<div style="font-weight:600;margin-bottom:4px">Link to this tile</div>' +
    '<div style="color:#6b7280;margin-bottom:10px">Opens on this tab, granularity, week and filters.</div>';

  var inp = document.createElement('input');
  inp.readOnly = true; inp.value = url;
  inp.style.cssText = 'width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-family:monospace;font-size:11px';
  box.appendChild(inp);

  if (!SHARE_URL) {
    var warn = document.createElement('div');
    warn.style.cssText = 'color:#b45309;margin-top:8px';
    warn.textContent = 'App address not loaded yet — prefix this with the dashboard URL, or close and retry in a second.';
    box.appendChild(warn);
  }

  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:12px';
  var copy = document.createElement('button');
  copy.className = 'btn-refresh'; copy.textContent = 'Copy';
  copy.onclick = function () {
    inp.select(); inp.setSelectionRange(0, 99999);
    var done = function () { copy.textContent = 'Copied \u2713'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { copy.textContent = 'Press \u2318C'; });
      } else if (document.execCommand('copy')) { done(); }
      else { copy.textContent = 'Press \u2318C'; }
    } catch (e) { copy.textContent = 'Press \u2318C'; }
  };
  var close = document.createElement('button');
  close.className = 'btn-refresh'; close.textContent = 'Close';
  close.onclick = function () { ov.remove(); };
  row.appendChild(copy); row.appendChild(close); box.appendChild(row);

  ov.appendChild(box); document.body.appendChild(ov);
  inp.select(); inp.setSelectionRange(0, 99999);
}

// One-shot: scroll to and flash the shared tile once it exists in the DOM. Called from render()'s
// callback — NOT chained onto window.afterDashboardRender, which is a single slot owned by
// comments.html; overwriting it kills the comment markers.
var _shareScrollDone = false;
function maybeShareScroll() {
  if (_shareScrollDone || !DEEPLINK.t) return;
  var el = document.querySelector('[data-comment-target="' + String(DEEPLINK.t).replace(/["\\]/g, '\\$&') + '"]');
  if (!el) return;                                        // wrong tab / not rendered yet
  _shareScrollDone = true;
  setTimeout(function () {
    el.scrollIntoView({ block: 'center' });
    var prev = el.style.outline;
    el.style.outline = '3px solid #2563eb';               // inline, so styles.html stays out of the deploy
    el.style.outlineOffset = '2px';
    setTimeout(function () { el.style.outline = prev; el.style.outlineOffset = ''; }, 2500);
  }, 0);
}

// ── Sections ────────────────────────────────────────────────────────────────
function section(id, title, content) {
  return '<div class="section" id="sec-' + id + '" data-comment-target="section:' + id + '" data-view="' + currentView + '"><div class="section-header" onclick="toggleSection(\'' + id + '\')">' +
    '<span class="section-title">' + title + '</span>' + shareBtn('section:' + id, true) +
    '<span class="section-chevron">▼</span></div><div class="section-body">' + content + '</div></div>';
}
function toggleSection(id) { var el = document.getElementById('sec-' + id); if (!el) return; var now = !el.classList.contains('collapsed'); el.classList.toggle('collapsed'); collapsedSections[id] = now; }
function applyCollapsed() { Object.keys(collapsedSections).forEach(function (id) { var el = document.getElementById('sec-' + id); if (el && collapsedSections[id]) el.classList.add('collapsed'); }); }

// ── Refresh ────────────────────────────────────────────────────────────────
var _reqId = 0;
function onRefresh() {
  var btn = document.getElementById('refresh-btn'); btn.disabled = true; btn.textContent = '↻ Refreshing…';
  var myId = ++_reqId, t0 = Date.now();
  if (!(window.google && window.google.script && window.google.script.run)) { setTimeout(function () { btn.disabled = false; btn.textContent = '↻ Refresh'; renderBadge(true, 0.1); }, 250); return; }
  window.google.script.run
    .withSuccessHandler(function (res) {
      if (myId !== _reqId) return;
      BOOT = res; applyMeta(BOOT.aux && BOOT.aux.meta);
      REG_BY_KEY = {}; METRIC_REGISTRY.forEach(function (m) { REG_BY_KEY[m.key] = m; });
      SERIES_CACHE = {}; DOMAINS = {}; DOMAINS_BY_KEY = {};   // server bumped its salt → drop stale client caches
      selectedWeek = BOOT.weeks[0] || selectedWeek;
      (function () { var d = new Date(), u = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); u.setUTCDate(u.getUTCDate() - (u.getUTCDay() === 0 ? 6 : u.getUTCDay() - 1)); var mon = isoOf(u); if (mon > (BOOT.weeks[0] || '')) { BOOT.weeks.unshift(mon); selectedWeek = mon; } })();
      populateWeeks(); populateFilters(); renderSidebar(); render();
      btn.disabled = false; btn.textContent = '↻ Refresh'; renderBadge(true, (Date.now() - t0) / 1000);
    })
    .withFailureHandler(function (e) { if (myId !== _reqId) return; btn.disabled = false; btn.textContent = '↻ Refresh'; alert('Refresh failed: ' + e.message); })
    .refreshBootstrap();
}
function renderBadge(live, secs) {
  var b = document.getElementById('cache-badge'); var when = BOOT.generatedAt ? new Date(BOOT.generatedAt).toLocaleString() : '';
  // Which server build is actually serving this page, + the cache salt. 'build ?' means
  // the deployed Code.gs predates BUILD, i.e. the /exec deployment was never bumped —
  // which is otherwise indistinguishable from a code bug.
  // JS_BUILD is the CLIENT half: it reports which javascript.html /exec is actually serving,
  // which BOOT.build cannot (they are separate files, pasted and versioned separately).
  var tag = ' · ' + (BOOT.build || 'build ?') + (BOOT.salt ? '/s' + BOOT.salt : '') + ' · ' + JS_BUILD;
  if (live) { b.textContent = 'live · ' + (secs ? secs.toFixed(1) + 's' : '') + ' · ' + when + tag; b.className = 'cache-badge live'; }
  else { b.textContent = 'cached · ' + when + tag; b.className = 'cache-badge'; }
}
</script>
