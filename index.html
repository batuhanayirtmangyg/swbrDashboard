<div class="app-body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">

    <div class="controls">
      <button class="btn-sidebar-toggle" onclick="toggleSidebar()" title="Toggle navigation">&#9776;</button>
      <div class="ctrl-group"><label>Aggregate</label>
        <div class="view-toggle" id="gran-toggle">
          <button id="gran-week"    class="view-btn active" onclick="setGranularity('week')">Weekly</button>
          <button id="gran-month"   class="view-btn"        onclick="setGranularity('month')">Monthly</button>
          <button id="gran-quarter" class="view-btn"        onclick="setGranularity('quarter')">Quarterly</button>
          <button id="gran-year"    class="view-btn"        onclick="setGranularity('year')">Yearly</button>
        </div>
      </div>

      <div class="ctrl-group" id="week-wrap">
        <label>As of week</label>
        <select id="week-sel" onchange="onWeekChange()"></select>
      </div>

      <!-- config-driven filter slots (channel today; city / supplier_id / tour_id plug in here) -->
      <div id="filter-slots" style="display:flex;align-items:center;gap:14px;"></div>

      <button class="btn-refresh" id="refresh-btn" onclick="onRefresh()">&#8635; Refresh</button>
      <button id="btn-glossary" class="btn-refresh" onclick="renderGlossary()" style="margin-left:6px">Glossary</button>
      <button class="btn-refresh" onclick="localStorage.removeItem('wbr_onboarding_done'); window.startOnboarding && window.startOnboarding({})" style="margin-left:6px">Take a tour</button>
      <!-- #btn-analytics is injected here by applyAdminState() (javascript.html) for admins. -->
      <span class="cache-badge" id="cache-badge"></span>
    </div>

    <div class="sections-area" id="sections-area">
      <div class="msg"><span class="spinner"></span>Loading…</div>
    </div>

    <footer>Supply WBR dashboard · data from the raw-data spreadsheet · built on the GYG dashboard theme</footer>
  </div>
</div>

<script>
  // Inlined by doGet() so the page renders instantly with data already present.
  window.__BOOTSTRAP__ = <?!= bootstrapJson ?>;
  window.__DEEPLINK__ = <?!= deepLinkJson ?>;
</script>

<!-- Analytics modal (admin-only) -->
<div id="analytics-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:min(960px,96vw);max-height:82vh;overflow:auto;padding:24px;font-family:'Century Gothic','Gill Sans',Arial,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <strong style="font-size:15px;font-family:'Century Gothic',Arial">Dashboard Analytics</strong>
      <button onclick="closeAnalytics()" style="border:none;background:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1">×</button>
    </div>
    <div id="analytics-body"><span class="spinner"></span> Loading…</div>
  </div>
</div>

<!-- FPOPS-55: Glossary modal -->
<div id="glossary-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:min(1040px,96vw);max-height:82vh;overflow:auto;padding:24px;font-family:'Century Gothic','Gill Sans',Arial,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <strong style="font-size:15px;font-family:'Century Gothic',Arial">Metric Glossary</strong>
      <button onclick="closeGlossary()" style="border:none;background:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1">×</button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:left">
      <thead>
        <tr style="border-bottom:2px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:1">
          <th class="left" style="padding:6px 12px">Metric</th>
          <th class="left" style="padding:6px 12px">Definition</th>
          <th class="left" style="padding:6px 12px">Relevant Cuts</th>
          <th class="left" style="padding:6px 12px">Business Owner</th>
          <th class="left" style="padding:6px 12px;color:#6b7280">FP&amp;A Owner</th>
        </tr>
      </thead>
      <tbody id="glossary-body"></tbody>
    </table>
  </div>
</div>
